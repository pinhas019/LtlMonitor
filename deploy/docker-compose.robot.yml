# Robot tier: what runs ON the machine that moves.
#
#   docker compose -f deploy/docker-compose.robot.yml up --build
#   docker compose -f deploy/docker-compose.robot.yml \
#                  -f deploy/docker-compose.dev.yml up      # live source overlay
#
# Clock, evaluator, monitor (tier 1 -- the safety ladder), supervisor. The tier-2
# monitor, the gateway and the frontend live in docker-compose.server.yml; the
# describer is a job and is declared there too.
#
# Every service builds with `context: ..` (the repo root) because the images COPY
# skill_monitor/, which is above deploy/. Building from deploy/ as context is the
# mistake that cannot be made here.
#
# Artifacts arrive on volumes, not baked in:
#   /config  adapters/ + specs/, read-only  -- change a skill or a robot, no rebuild
#   /data    verdicts + automaton renders, read-write
# With nothing mounted the images still boot on their packaged defaults and say so
# (skill_monitor.config_report()). That fallback is what keeps pytest and a bare
# `python3 -m skill_monitor...` working on a host with no volumes.

x-ros: &ros
  # host networking + host IPC: DDS discovery and shared-memory transport between
  # containers. Bridged networking makes the nodes silently not see each other.
  network_mode: host
  ipc: host
  environment: &ros-env
    ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
    # Which DDS. Empty is the image default (rmw_fastrtps_cpp); set it to whatever the
    # robot's own containers use -- rmw_cyclonedds_cpp on the G1 -- when this stack has
    # to see a graph it does not own. Two nodes with different RMWs never discover each
    # other and nothing says so.
    # Passed through from the host ONLY when set, which is what the bare keys mean:
    # an RMW_IMPLEMENTATION of "" is not the same as unset, and some ROS versions try
    # to load an implementation by that empty name rather than falling back.
    RMW_IMPLEMENTATION:
    CYCLONEDDS_URI:
    PYTHONUNBUFFERED: "1"
    SKILL_MONITOR_CONFIG: /config
  restart: unless-stopped

x-config-ro: &config-ro
  # Host paths, overridable: SKILL_MONITOR_CONFIG_HOST=/srv/robot-config docker compose up
  - "${SKILL_MONITOR_CONFIG_HOST:-../config}:/config:ro"

services:

  # The tick everything else advances on. One clock per tier, and THIS one is
  # authoritative for live data -- the tick index is stamped here and travels inside
  # the observation, so the server's monitor advances on the received tick rather
  # than on a second clock racing this one.
  #
  # NOTE: deploy/Dockerfile.clock does not exist yet -- it is owned by P1 (clock
  # service) and lands with that package. This service is declared now so the stack
  # is complete and reviewable; `up --build` will fail on it until P1 merges.
  clock:
    <<: *ros
    container_name: sm-clock
    build:
      context: ..
      dockerfile: deploy/Dockerfile.clock
    image: skill-monitor/clock:${TAG:-dev}
    command: ["--rate", "${TICK_HZ:-1.0}", "--source", "wall"]

  # Embodiment stops here. The evaluator is the only service that reads an adapter
  # descriptor, and the only one that names a robot.
  evaluator:
    <<: *ros
    container_name: sm-evaluator
    build:
      context: ..
      dockerfile: deploy/Dockerfile.evaluator
    image: skill-monitor/evaluator:${TAG:-dev}
    command: ["--adapter", "${ADAPTER:-real_g1}"]
    volumes: *config-ro
    depends_on: [clock]

  # Tier 1: the safety ladder, on the robot, where latency matters. Reads a spec and
  # nothing else -- never an adapter descriptor; it learns the schema from the
  # evaluator's latched /monitor/adapter.
  monitor:
    <<: *ros
    container_name: sm-monitor
    build:
      context: ..
      dockerfile: deploy/Dockerfile.monitor
    image: skill-monitor/monitor:${TAG:-dev}
    # A BARE spec name, not a path: it resolves through skill_monitor.spec_path(),
    # which searches /config/specs first and the packaged specs second. Passing
    # /config/specs/... here instead would hard-fail an unmounted container.
    command: ["--formulas-file", "${SPEC:-formulas_g1.json}", "--output-dir", "/data/output"]
    volumes:
      - "${SKILL_MONITOR_CONFIG_HOST:-../config}:/config:ro"
      # Read-write: verdict records and the automaton PNGs rendered at spec load.
      - "${SKILL_MONITOR_DATA_HOST:-../data}:/data"
    depends_on: [clock, evaluator]

  # The session, written down. A JOB, not a service. ONE command, ONE artifact:
  #
  #   docker compose -f deploy/docker-compose.robot.yml run --rm recorder \
  #                  session /data/g1_run1 --note "dead end on purpose"
  #   docker compose -f deploy/docker-compose.robot.yml run --rm recorder verify /data/g1_run1
  #
  # `session` writes a bundle -- session.json, stream.jsonl, sensors/ -- and launches the
  # `ros2 bag record` itself off the adapter frame it just received. Everything else here
  # is the same entry point at a lower level, kept because a replay and a relay need it:
  #
  #   docker compose -f deploy/docker-compose.robot.yml run --rm recorder record /data/g1_run1.jsonl
  #   docker compose -f deploy/docker-compose.robot.yml run --rm recorder info   /data/g1_run1
  #
  # P9 makes verdict equality between two replays of one episode THE acceptance test for
  # the hardware-agnosticism claim, and P12's four uncalibrated knobs (arrival_radius,
  # the closing_speed epsilon, the no_progress debounce, the min_range height band) each
  # need a recorded run before they can be trusted. Both of those need this file to
  # exist, and until now no stack ran the recorder -- the plan said "record it" and the
  # only way to obey was a hand-written `docker run`, composed differently every time.
  #
  # The EVALUATOR image, deliberately: `replay_node` needs rclpy and not Spot, and a
  # recording is worthless if the thing that wrote it could not be built on the robot.
  # The entrypoint is overridden because each image bakes in one entry point, and this
  # is a second use of that image rather than a second image.
  #
  # `profiles: ["job"]` keeps it out of `up`. Started by `up` it would record every
  # session to one fixed path, and the second run would truncate the first.
  #
  # `session` spawns `ros2 bag record` as a child, so this container needs rosbag2 --
  # which ros:humble has, being ros_base. It writes into /data, on the HOST, because the
  # one thing that must outlive the container is the only thing that cannot be
  # regenerated.
  recorder:
    <<: *ros
    container_name: sm-recorder
    build:
      context: ..
      dockerfile: deploy/Dockerfile.evaluator
    image: skill-monitor/evaluator:${TAG:-dev}
    entrypoint: ["/bin/bash", "-c",
                 "source /opt/ros/humble/setup.bash && python3 -m skill_monitor.backend.replay_node \"$@\"",
                 "--"]
    volumes:
      - "${SKILL_MONITOR_CONFIG_HOST:-../config}:/config:ro"
      # Read-write, and the only reason this service differs from `evaluator`: the
      # episode is written here, on the host, where it survives the container.
      - "${SKILL_MONITOR_DATA_HOST:-../data}:/data"
    profiles: ["job"]
    restart: "no"

  # "Is the graph this stack expects actually there?" -- a JOB, and the first thing to
  # run when the evaluator sees nothing:
  #
  #   docker compose -f deploy/docker-compose.robot.yml run --rm preflight --rates
  #
  # Here as a service because the machine that most needs to ask may have no ROS on it
  # at all: with the monitor on a PC and the G1 merely publishing, the PC has this
  # stack and nothing else. The `ros2` CLI inside this image answers the question, and
  # the RMW_IMPLEMENTATION / ROS_DOMAIN_ID this service inherits are exactly the ones
  # the evaluator will use -- which is the point. A preflight run with different
  # settings than the thing it is clearing tests nothing.
  #
  # tools/ is MOUNTED and not COPYed: `tools/README.md` states nothing there is part of
  # the package and nothing in the package imports it, and baking it into an image would
  # quietly make that false.
  preflight:
    <<: *ros
    container_name: sm-preflight
    build:
      context: ..
      dockerfile: deploy/Dockerfile.evaluator
    image: skill-monitor/evaluator:${TAG:-dev}
    entrypoint: ["/bin/bash", "-c",
                 "source /opt/ros/humble/setup.bash && python3 /tools/g1_preflight.py \"$@\"",
                 "--"]
    command: ["--adapter", "${ADAPTER:-real_g1}"]
    volumes:
      - "../tools:/tools:ro"
      - "${SKILL_MONITOR_CONFIG_HOST:-../config}:/config:ro"
    profiles: ["job"]
    restart: "no"

  # Enforces nothing until enabled -- see P5. Robot tier only: an intervention
  # decided across the network is an intervention that arrives late.
  supervisor:
    <<: *ros
    container_name: sm-supervisor
    build:
      context: ..
      dockerfile: deploy/Dockerfile.supervisor
    image: skill-monitor/supervisor:${TAG:-dev}
    volumes: *config-ro
    depends_on: [monitor]
