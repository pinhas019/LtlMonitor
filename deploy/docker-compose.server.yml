# Server tier: what runs OFF the robot -- the verdict of record, the API, the console.
#
#   docker compose -f deploy/docker-compose.server.yml up --build
#   docker compose -f deploy/docker-compose.server.yml run --rm describer \
#                  --description "walk to the goal without falling"
#
# Clock (replay only), monitor tier-2, gateway, frontend, plus the describer job.
#
# The server's clock exists ONLY to pace replay of a recorded stream. Live data
# advances on the tick stamped by the robot's clock inside the observation. Two
# clocks driving one trace is the bug that rule prevents -- see docs/clocking.md.

x-ros: &ros
  network_mode: host
  ipc: host
  environment: &ros-env
    ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
    # Which DDS. Empty is the image default (rmw_fastrtps_cpp); set it to whatever the
    # robot's own containers use -- rmw_cyclonedds_cpp on the G1 -- when this stack has
    # to see a graph it does not own. Two nodes with different RMWs never discover each
    # other and nothing says so.
    # Passed through from the host ONLY when set, which is what the bare keys mean:
    # an RMW_IMPLEMENTATION of "" is not the same as unset, and some ROS versions try
    # to load an implementation by that empty name rather than falling back.
    RMW_IMPLEMENTATION:
    CYCLONEDDS_URI:
    PYTHONUNBUFFERED: "1"
    SKILL_MONITOR_CONFIG: /config
  restart: unless-stopped

services:

  # Replay pacing only; idle for live traffic. Started with --paused so that
  # bringing the server up never advances a trace nobody asked to advance.
  #
  # NOTE: deploy/Dockerfile.clock is owned by P1 and lands with that package.
  # Declared here now so the stack is complete; `up --build` fails on it until then.
  clock:
    <<: *ros
    container_name: sm-clock-replay
    build:
      context: ..
      dockerfile: deploy/Dockerfile.clock
    image: skill-monitor/clock:${TAG:-dev}
    command: ["--rate", "${REPLAY_HZ:-1.0}", "--source", "replay", "--paused"]

  # Tier 2: the verdict of record. No adapter present and none needed -- it advances
  # on the tick inside each received observation. That is exactly what makes it
  # runnable here, a network away from any robot.
  monitor:
    <<: *ros
    container_name: sm-monitor-tier2
    build:
      context: ..
      dockerfile: deploy/Dockerfile.monitor
    image: skill-monitor/monitor:${TAG:-dev}
    # Bare spec name -- resolved by skill_monitor.spec_path() against /config/specs
    # first, packaged specs second.
    command: ["--formulas-file", "${SPEC:-formulas_g1.json}", "--output-dir", "/data/output"]
    volumes:
      - "${SKILL_MONITOR_CONFIG_HOST:-../config}:/config:ro"
      - "${SKILL_MONITOR_DATA_HOST:-../data}:/data"
    depends_on: [clock]

  # REST + websocket in front of the ROS graph, so the frontend needs no DDS.
  #
  # NOTE: deploy/Dockerfile.gateway is owned by P6 and lands with that package.
  # Declared here now so the stack is complete; `up --build` fails on it until then.
  gateway:
    <<: *ros
    container_name: sm-gateway
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    image: skill-monitor/gateway:${TAG:-dev}
    command: ["--port", "${GATEWAY_PORT:-8080}"]
    volumes:
      - "${SKILL_MONITOR_CONFIG_HOST:-../config}:/config:ro"
      - "${SKILL_MONITOR_DATA_HOST:-../data}:/data:ro"
    depends_on: [monitor]

  # The Skill Center console: a browser page, served by a gateway of its own.
  #
  # It does NOT proxy the `gateway` service above -- it holds its own Gateway on its own
  # origin, because the page and the API it calls have to be same-origin for the CSRF
  # and Origin gates to stay shut. `gateway` remains the API for everything that is not
  # this page. Both read the same graph, so two subscribers is the only cost.
  #
  # This used to be the Tk panel and no longer is, which removed the X11 socket, DISPLAY
  # and -- the one that mattered -- the /var/run/docker.sock mount that gave the
  # container root-equivalent control of the host. See deploy/Dockerfile.skill_center.
  frontend:
    <<: *ros
    container_name: sm-frontend
    build:
      context: ..
      dockerfile: deploy/Dockerfile.skill_center
    image: skill-monitor/skill-center:${TAG:-dev}
    # Loopback, like the gateway: the console has no authentication and this is the only
    # place that decision is visible. `--host 0.0.0.0` is the one explicit edit that
    # publishes it, made by someone who read the header of the Dockerfile.
    # 8082 and NOT the image's own 8081 default. deploy/Dockerfile.clock takes 8081
    # ("because 8080 is the gateway") and deploy/Dockerfile.skill_center takes 8081
    # ("the console cannot share the gateway's 8080") -- each correct alone, and a
    # collision here, where `network_mode: host` gives both services the one loopback
    # and the clock binds first. The image default stays 8081 for a standalone
    # `docker run` with no clock beside it; a stack that has one says so.
    command: ["--port", "${CONSOLE_PORT:-8082}"]
    environment:
      <<: *ros-env
      # Both halves of the port, together. The image's HEALTHCHECK reads this one; drop
      # it and the check probes 8081 while the console listens wherever --port said, so
      # a healthy console reports unhealthy -- or worse, finds the gateway on 8080.
      CONSOLE_PORT: "${CONSOLE_PORT:-8082}"
    volumes:
      - "${SKILL_MONITOR_CONFIG_HOST:-../config}:/config:ro"
      - "${SKILL_MONITOR_DATA_HOST:-../data}:/data:ro"
    depends_on: [gateway]

  # Replay, on the tier that is meant to produce the verdict of record.
  #
  #   docker compose -f deploy/docker-compose.server.yml run --rm recorder play \
  #                  /data/g1_run1.jsonl --diff        # exits 1 on any difference
  #   docker compose -f deploy/docker-compose.server.yml run --rm recorder info /data/g1_run1.jsonl
  #   docker compose -f deploy/docker-compose.server.yml run --rm recorder topics --scene /data/g1_run1.jsonl
  #
  # The same job as the robot tier's `recorder`, declared in both because the two tiers
  # use it for opposite halves of one rule: the robot RECORDS the inputs, this side
  # REPLAYS them and compares the outputs. A replay wants the machine with the disk and
  # the screen, not the one with the battery.
  #
  # `play` needs the monitor up and BOTH input producers down -- the clock and the
  # evaluator. It publishes the recorded ticks itself, so a live clock would interleave
  # a second time base into an episode that already has one; it counts the publishers it
  # is competing with and says so rather than letting the diff discover it.
  recorder:
    <<: *ros
    container_name: sm-replay
    build:
      context: ..
      dockerfile: deploy/Dockerfile.evaluator
    image: skill-monitor/evaluator:${TAG:-dev}
    entrypoint: ["/bin/bash", "-c",
                 "source /opt/ros/humble/setup.bash && python3 -m skill_monitor.backend.replay_node \"$@\"",
                 "--"]
    volumes:
      - "${SKILL_MONITOR_CONFIG_HOST:-../config}:/config:ro"
      - "${SKILL_MONITOR_DATA_HOST:-../data}:/data"
    profiles: ["job"]
    restart: "no"

  # The carriage for the observation stream, when the robot's DDS cannot reach here.
  #
  #   ssh <robot> 'docker compose -f ~/skillMonitor/deploy/docker-compose.robot.yml \
  #                run --rm -T recorder record -' \
  #     | docker compose -f deploy/docker-compose.server.yml run --rm -T relay
  #
  # A JOB, and the one service in this file with no ROS input of its own: it reads JSON
  # Lines on STDIN and publishes them onto this machine's graph, so `monitor` above sees
  # the robot's ticks, observations and adapter exactly as if the evaluator were local.
  # That is the tier-2 monitor's stated design -- "no adapter present and none needed,
  # it advances on the tick inside each received observation" -- finally given a way to
  # receive one.
  #
  # ssh is the transport and it is not incidental: on this robot DDS never crossed the
  # wifi (measured, with UDP flowing both ways and unicast peers configured), while ssh
  # does. It also means the link is authenticated and encrypted, which the ROS graph is
  # not, and that nothing has to listen on a port anywhere.
  #
  # `-T` on BOTH ends. Without it compose allocates a TTY, and a TTY mangles the stream
  # into something neither end can parse.
  #
  # `clock` above stays --paused while this runs. The tick belongs to the robot and
  # arrives inside the stream; a second clock here would step the monitor on a time base
  # the observations know nothing about. The relay warns if it finds one publishing.
  #
  # The EVALUATOR image: `replay_node` needs rclpy, not Spot.
  relay:
    <<: *ros
    container_name: sm-relay
    build:
      context: ..
      dockerfile: deploy/Dockerfile.evaluator
    image: skill-monitor/evaluator:${TAG:-dev}
    entrypoint: ["/bin/bash", "-c",
                 "source /opt/ros/humble/setup.bash && python3 -m skill_monitor.backend.replay_node relay \"$@\"",
                 "--"]
    stdin_open: true
    profiles: ["job"]
    restart: "no"

  # A JOB, not a service: `docker compose ... run --rm describer --description "..."`.
  # No ROS in the image; it talks to an LLM over HTTP and writes a validated spec.
  describer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.describer
    image: skill-monitor/describer:${TAG:-dev}
    network_mode: host
    environment:
      PYTHONUNBUFFERED: "1"
      SKILL_MONITOR_CONFIG: /config
      LLM_API_URL: "${LLM_API_URL:-http://192.168.140.101/developer-api/v1}"
      LLM_MODEL: "${LLM_MODEL:-Gemma4}"
    # The ONE service that mounts /config read-write: it reads the robot's sensor
    # schema from /config/adapters and writes the generated spec into /config/specs,
    # where the monitor picks it up on the next load.
    volumes:
      - "${SKILL_MONITOR_CONFIG_HOST:-../config}:/config"
    # Never started by `up` -- only by `run`.
    profiles: ["job"]
    restart: "no"
