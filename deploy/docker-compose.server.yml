# Server tier: what runs OFF the robot -- the verdict of record, the API, the console.
#
#   docker compose -f deploy/docker-compose.server.yml up --build
#   docker compose -f deploy/docker-compose.server.yml run --rm describer \
#                  --description "walk to the goal without falling"
#
# Clock (replay only), monitor tier-2, gateway, frontend, plus the describer job.
#
# The server's clock exists ONLY to pace replay of a recorded stream. Live data
# advances on the tick stamped by the robot's clock inside the observation. Two
# clocks driving one trace is the bug that rule prevents -- see docs/clocking.md.

x-ros: &ros
  network_mode: host
  ipc: host
  environment: &ros-env
    ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
    PYTHONUNBUFFERED: "1"
    SKILL_MONITOR_CONFIG: /config
    # The server tier subscribes to the SAME graph as the robot tier, so it needs the
    # same RMW. Both default to CycloneDDS for that reason -- a server on FastDDS talking
    # to a robot on CycloneDDS does not error, it just serves an empty /api/monitors,
    # which reads as "the robot is down" rather than "these two cannot hear each other".
    RMW_IMPLEMENTATION: "${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}"
    # The interface DDS binds, and here it is the SERVER's, not the robot's -- the two
    # machines rarely name it the same thing. Measured: the G1 reaches the dev PC over
    # `eth0` on its side and `eno1` on the dev PC's, and DDS crosses that wired link in
    # both directions with no relay in between.
    DDS_INTERFACE: "${DDS_INTERFACE:-eth0}"
    CYCLONEDDS_URI: "${CYCLONEDDS_URI:-<CycloneDDS><Domain Id='any'><SharedMemory><Enable>false</Enable></SharedMemory><General><Interfaces><NetworkInterface name='${DDS_INTERFACE:-eth0}' multicast='true'/></Interfaces><AllowMulticast>spdp</AllowMulticast></General></Domain></CycloneDDS>}"
  restart: unless-stopped

services:

  # Replay pacing only; idle for live traffic. Started with --paused so that
  # bringing the server up never advances a trace nobody asked to advance.
  #
  # NOTE: deploy/Dockerfile.clock is owned by P1 and lands with that package.
  # Declared here now so the stack is complete; `up --build` fails on it until then.
  clock:
    <<: *ros
    container_name: sm-clock-replay
    build:
      context: ..
      dockerfile: deploy/Dockerfile.clock
    image: skill-monitor/clock:${TAG:-dev}
    command: ["--rate", "${REPLAY_HZ:-1.0}", "--source", "replay", "--paused"]

  # Tier 2: the verdict of record. No adapter present and none needed -- it advances
  # on the tick inside each received observation. That is exactly what makes it
  # runnable here, a network away from any robot.
  monitor:
    <<: *ros
    container_name: sm-monitor-tier2
    build:
      context: ..
      dockerfile: deploy/Dockerfile.monitor
    image: skill-monitor/monitor:${TAG:-dev}
    # Bare spec name -- resolved by skill_monitor.spec_path() against /config/specs
    # first, packaged specs second.
    command: ["--formulas-file", "${SPEC:-formulas_g1.json}", "--output-dir", "/data/output"]
    volumes:
      - "${SKILL_MONITOR_CONFIG_HOST:-../config}:/config:ro"
      - "${SKILL_MONITOR_DATA_HOST:-../data}:/data"
    depends_on: [clock]

  # REST + websocket in front of the ROS graph, so the frontend needs no DDS.
  #
  # NOTE: deploy/Dockerfile.gateway is owned by P6 and lands with that package.
  # Declared here now so the stack is complete; `up --build` fails on it until then.
  gateway:
    <<: *ros
    container_name: sm-gateway
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    image: skill-monitor/gateway:${TAG:-dev}
    command: ["--port", "${GATEWAY_PORT:-8080}"]
    volumes:
      - "${SKILL_MONITOR_CONFIG_HOST:-../config}:/config:ro"
      - "${SKILL_MONITOR_DATA_HOST:-../data}:/data:ro"
    depends_on: [monitor]

  # The Skill Center console: a browser page, served by a gateway of its own.
  #
  # It does NOT proxy the `gateway` service above -- it holds its own Gateway on its own
  # origin, because the page and the API it calls have to be same-origin for the CSRF
  # and Origin gates to stay shut. `gateway` remains the API for everything that is not
  # this page. Both read the same graph, so two subscribers is the only cost.
  #
  # This used to be the Tk panel and no longer is, which removed the X11 socket, DISPLAY
  # and -- the one that mattered -- the /var/run/docker.sock mount that gave the
  # container root-equivalent control of the host. See deploy/Dockerfile.skill_center.
  frontend:
    <<: *ros
    container_name: sm-frontend
    build:
      context: ..
      dockerfile: deploy/Dockerfile.skill_center
    image: skill-monitor/skill-center:${TAG:-dev}
    # Loopback, like the gateway: the console has no authentication and this is the only
    # place that decision is visible. `--host 0.0.0.0` is the one explicit edit that
    # publishes it, made by someone who read the header of the Dockerfile.
    command: ["--port", "${CONSOLE_PORT:-8081}"]
    environment:
      <<: *ros-env
      # Both halves of the port, together. The image's HEALTHCHECK reads this one; drop
      # it and the check probes 8081 while the console listens wherever --port said, so
      # a healthy console reports unhealthy -- or worse, finds the gateway on 8080.
      CONSOLE_PORT: "${CONSOLE_PORT:-8081}"
    volumes:
      - "${SKILL_MONITOR_CONFIG_HOST:-../config}:/config:ro"
      - "${SKILL_MONITOR_DATA_HOST:-../data}:/data:ro"
    depends_on: [gateway]

  # A JOB, not a service: `docker compose ... run --rm describer --description "..."`.
  # No ROS in the image; it talks to an LLM over HTTP and writes a validated spec.
  describer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.describer
    image: skill-monitor/describer:${TAG:-dev}
    network_mode: host
    environment:
      PYTHONUNBUFFERED: "1"
      SKILL_MONITOR_CONFIG: /config
      LLM_API_URL: "${LLM_API_URL:-http://192.168.140.101/developer-api/v1}"
      LLM_MODEL: "${LLM_MODEL:-Gemma4}"
    # The ONE service that mounts /config read-write: it reads the robot's sensor
    # schema from /config/adapters and writes the generated spec into /config/specs,
    # where the monitor picks it up on the next load.
    volumes:
      - "${SKILL_MONITOR_CONFIG_HOST:-../config}:/config"
    # Never started by `up` -- only by `run`.
    profiles: ["job"]
    restart: "no"
