  // dashboard reads as importance.
  const w = AUT.PAD * 2 + maxCol * AUT.COL + 70;
  const h = AUT.TOP + maxRow * AUT.ROW + AUT.PAD;

  const wire = edges.map(e => {
    const f = at[String(e.from)], t = at[String(e.to)];
    if (f === undefined || t === undefined) return "";      // an edge to nowhere
    return f === t ? selfLoop(X(f), Y(f), e.label, w)
                   : link(X(f), Y(f), X(t), Y(t), col[t] <= col[f], e.label, w);
  }).join("");

  const node = states.map((s, si) => {
    const acc = s.accepting === true, sink = s.sink === true;
    const kind = acc && sink ? "accepting and absorbing"
               : acc ? "accepting" : sink ? "absorbing sink" : "ordinary";
    const shape = sink
      ? `<rect class="shape" x="-14" y="-14" width="28" height="28" rx="3"/>` +
        (acc ? `<rect class="inner" x="-10" y="-10" width="20" height="20" rx="2"/>` : "")
      : `<circle class="shape" r="${AUT.R}"/>` +
        (acc ? `<circle class="inner" r="${AUT.R - 4}"/>` : "");
    // The initial state gets the stub arrow it always gets, so "where this starts" is
    // on the drawing rather than only in the caption.
    const stub = si === start
      ? `<path class="e" d="M${X(si) - 40} ${Y(si)} L${X(si) - AUT.R - 9} ${Y(si)}"/>` +
        arrowHead(X(si) - AUT.R - 4, Y(si), 1, 0)
      : "";
    return stub + `<g id="aut${gi}n${si}" class="n${acc ? " acpt" : ""}${sink ? " sink" : ""}"
      transform="translate(${X(si)},${Y(si)})"><title>state ${esc(s.id)} — ${kind}</title>
      ${shape}<text text-anchor="middle" y="4">${esc(s.id)}</text></g>`;
  }).join("");

  return `<div class="aut">
    <div class="lbl"><span class="key">${esc(g.name)}</span>
      <span class="dim wrap" style="text-align:right">${esc(g.formula || "")}</span></div>
    <svg viewBox="0 0 ${w} ${h}" style="width:${w}px;max-width:100%;height:auto"
      role="img">${wire}${node}</svg>
    <p class="dim" id="aut${gi}c" style="margin:0 0 8px"></p></div>`;
}

/* A label is wire data -- an operator-supplied spec's own text -- so it is escaped
   before it reaches innerHTML, and the untruncated form goes in the tooltip rather than
   being lost.

   `1` and `0` are not truncations and not sensor names: they are how Spot's
   `bdd_format_formula` spells the unconditional and the impossible guard, and every
   absorbing state's self-loop carries the first of them. Left as written they put a
   bare `1` on the drawing, which reads as a state number. Spelt out here, and only
   here, because it is a convention of the producer's formula printer rather than
   anything this page can generalise. */
const AUT_GUARD = { "1": "any input", "0": "never" };

function edgeLabel(x, y, label, w) {
  const raw_ = raw(label === undefined || label === null ? "" : label);
  if (!raw_) return "";
  const full = AUT_GUARD[raw_] || raw_;
  const shown = full.length > 20 ? full.slice(0, 19) + "…" : full;
  // Nudged inside the box. The first state's self-loop label is centred on the first
  // column and is wider than the margin, so centred-and-clipped loses the `!` that
  // inverts it -- `!mission_started` reading as `ission_started` is worse than a label
  // slightly off its own loop. Half-width is estimated from the character count: the
  // page's font is monospace, and nothing here needs it to the pixel.
  const half = shown.length * 3.1 + 2;
  const at = Math.min(Math.max(x, half), Math.max(half, w - half));
  return `<g><title>${esc(full)}</title><text class="elab" text-anchor="middle"
    x="${at.toFixed(1)}" y="${y.toFixed(1)}">${esc(shown)}</text></g>`;
}

function arrowHead(x, y, dx, dy) {
  const l = Math.hypot(dx, dy) || 1, ux = dx / l, uy = dy / l;
  const bx = x - ux * 8, by = y - uy * 8, px = -uy * 3.6, py = ux * 3.6;
  return `<path class="head" d="M${x.toFixed(1)} ${y.toFixed(1)}
    L${(bx + px).toFixed(1)} ${(by + py).toFixed(1)}
    L${(bx - px).toFixed(1)} ${(by - py).toFixed(1)} Z"/>`;
}

/* A self-loop is a real transition and is drawn as one: "the automaton stays here while
   this holds" is most of what a monitor automaton does. */
function selfLoop(x, y, label, w) {
  const end = y - AUT.R + 2;
  return `<path class="e" d="M${x - 8} ${end} C${x - 36} ${y - 52} ${x + 36} ${y - 52}
    ${x + 8} ${end}"/>` + arrowHead(x + 8, end, -28, 50 - AUT.R) +
    edgeLabel(x, y - 51, label, w);
}

/* One quadratic per edge, bowed below when it runs backwards or sideways so it does not
   lie on top of the forward chain. Both ends are pushed out to the node's rim along the
   direction of the control point, which is also the direction the arrowhead points. */
function link(x1, y1, x2, y2, back, label, w) {
  const bow = back ? 46 : 0;
  const dx = x2 - x1, dy = y2 - y1, l = Math.hypot(dx, dy) || 1;
  const cx = (x1 + x2) / 2 + (dy / l) * bow, cy = (y1 + y2) / 2 - (dx / l) * bow;
  const out = Math.hypot(cx - x1, cy - y1) || 1, into = Math.hypot(x2 - cx, y2 - cy) || 1;
  const sx = x1 + ((cx - x1) / out) * AUT.R, sy = y1 + ((cy - y1) / out) * AUT.R;
  const ex = x2 - ((x2 - cx) / into) * (AUT.R + 5);
  const ey = y2 - ((y2 - cy) / into) * (AUT.R + 5);
  const mx = (sx + 2 * cx + ex) / 4, my = (sy + 2 * cy + ey) / 4;
  return `<path class="e" d="M${sx.toFixed(1)} ${sy.toFixed(1)}
    Q${cx.toFixed(1)} ${cy.toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}"/>` +
    arrowHead(ex, ey, x2 - cx, y2 - cy) +
    edgeLabel(mx, my + (back ? 15 : -7), label, w);
}

/* The statuses, and which of them has a graph above. `phase:<phase>:<kind>` faults come
   from the phase machine rather than from an automaton and never have one -- the
   column says so rather than leaving a blank that reads like a missing value. */
function formulaTable(v) {
  const cls = { ACCEPTED: "ok", VIOLATED: "bad", INCONCLUSIVE: "dim" };
  const drawn = new Set(((S.manifest || {}).automata || []).map(a => (a || {}).name));
  const rows = ((v || {}).formulas || []).concat((v || {}).failure_modes || []).map(f =>
    `<tr><td>${esc(f.name)}</td>
     <td><span class="${cls[f.status] || "dim"}">${esc(f.status)}</span></td>
     <td class="dim">${txt(f.fault_category)}</td>
     <td class="dim">${f.confidence === undefined ? "" : num(f.confidence, 2)}</td>
     <td class="${drawn.has(f.name) ? "acc" : "dim"}">${drawn.has(f.name)
        ? txt(f.state) : "no graph"}</td></tr>`).join("");
  return `<table style="margin-top:8px">
    <tr><th>formula</th><th>status</th><th>category</th><th>conf</th><th>state</th></tr>
    ${rows}</table>`;
}

/* == 7 · phase machine ======================================================

   The timing layer above pane 6's Büchi automata. Same three sources and the same
   division of labour: `manifest.execution_phases` is the structure and is latched, so
   the SVG is laid out once per spec; the verdict carries where we are, how close the
   phase is to its bounds, and -- when the build reports it -- the live truth of the
   guards this phase declares.

   **Nothing here evaluates a guard.** `phase_guards[].value` is what the monitor
   actually acted on, and a second evaluator in this page is exactly where this
   project's `min_range < 0.25` decimal-point bug lived three times. The page does
   *name-match* the propositions an expression reads against `observation.ap_values`,
   which is string matching and not evaluation: it says what the monitor's answer was a
   function of, and shows each one's own reported value beside it.

   `value: null` renders as its own thing and never as false. "We did not check" and
   "it does not hold" are different facts about a phase, and one of them is a fault. */

/* Top to bottom, one phase per row. Pane 6's automata are wide and shallow and are laid
   out left to right; a phase machine is a chain, and in a dashboard column a chain has
   room downwards and none across. Vertical also leaves the whole right-hand side for
   the transition labels, which are an `exit_condition` in the spec's own words and are
   the one thing here that must not be truncated to fit. */
const PH = { W: 268, H: 46, GAPY: 46, PAD: 12, TOP: 26, LBL: 34 };

function renderPhases() {
  const v = S.verdict || null;
  const phases = (S.manifest || {}).execution_phases;
  const box = $("phase");
  if (!Array.isArray(phases)) {
    // Absent: a spec with no phase machine at all, or a build that cannot report one.
    S.ph.key = null;
    box.innerHTML = missing("manifest.execution_phases", "P4",
      "the manifest carries no phase machine, so there are no states to draw, no " +
      "per-phase bounds to measure a step against, and no guards to report.");
    return;
  }
  if (!phases.length) {
    S.ph.key = null;
    box.innerHTML = `<div class="missing">the manifest reports
      <code>execution_phases</code> and declares none: this spec runs as one
      unphased episode, so there is no phase machine above the automata.</div>`;
    return;
  }
  const key = JSON.stringify(phases);
  if (key !== S.ph.key) {
    S.ph.key = key;
    box.innerHTML = drawPhases(phases) +
      `<p class="dim" id="ph-cap" style="margin:2px 0 0"></p>
       <p class="dim" style="margin:4px 0 0">▶ and the double outline mark the phase
         the last verdict reported. An edge is labelled with the
         <code>exit_condition</code> of the phase it leaves.</p>
       <div id="ph-timing"></div><div id="ph-guards"></div>`;
  }
  const here = currentPhase(phases, v);
  phases.forEach((_p, i) => {
    const el = $(`ph${i}n`);
    if (el) el.classList.toggle("cur", i === here.i);
  });
  $("ph-cap").innerHTML = here.i === null
    ? esc(here.why)
    : `in <span class="acc">${esc(phaseName(phases, here.i))}</span>
       <span class="dim">[${here.i}]${here.why ? " — " + esc(here.why) : ""}</span>`;
  $("ph-timing").innerHTML = phaseTiming(phases, here.i, v);
  $("ph-guards").innerHTML = phaseGuards(phases, here.i, v);
}

function phaseName(phases, i) {
  const p = phases[i];
  return (p && typeof p.phase === "string") ? p.phase : `phase${i}`;
}

/* Which phase to light, and -- when it is none -- which silence this is.

   `phase_index` is the position and `phase` is the name; they should agree, and when
   they do not the page believes the *name*, because that is the string the guard block
   and the fault names are keyed on. It says which it used rather than picking quietly.
   Nothing is lit when the verdict reports no phase: a phase machine between phases is
   a real state, and lighting the first one would be the page inventing it. */
function currentPhase(phases, v) {
  if (!v) return { i: null, why: "no verdict seen yet — nothing is highlighted." };
  const named = phases.findIndex((p, i) => phaseName(phases, i) === v.phase);
  const i = typeof v.phase_index === "number" ? v.phase_index : null;
  if (i !== null && i >= 0 && i < phases.length) {
    if (v.phase === null || v.phase === undefined || phaseName(phases, i) === v.phase) {
      return { i: i, why: null };
    }
    return named >= 0
      ? { i: named, why: `matched by name: verdict.phase_index ${i} is ` +
                         `${phaseName(phases, i)}, which is not verdict.phase` }
      : { i: null, why: `the verdict's phase_index ${i} and phase ` +
                        `'${v.phase}' disagree and neither is this machine's — ` +
                        `nothing is highlighted.` };
  }
  if (named >= 0) return { i: named, why: "matched by name: the verdict reports no phase_index" };
  return { i: null, why: v.phase === null || v.phase === undefined
    ? "the last verdict reports no active phase — nothing is highlighted."
    : `the last verdict names a phase this manifest does not declare — nothing is highlighted.` };
}

function drawPhases(phases) {
  const cx = PH.PAD + PH.W / 2;
  const Y = i => PH.TOP + i * (PH.H + PH.GAPY) + PH.H / 2;
  const w = PH.PAD * 2 + PH.W + PH.LBL * 6.2 + 12;
  const h = PH.TOP + phases.length * PH.H + (phases.length - 1) * PH.GAPY + PH.PAD;

  // The stub the first phase gets for the same reason pane 6's initial state gets one:
  // "this is where the machine starts" belongs on the drawing.
  let wire = `<path class="e" d="M${cx} ${PH.TOP - 22} L${cx} ${PH.TOP - 5}"/>` +
    arrowHead(cx, PH.TOP, 0, 1);
  for (let i = 0; i + 1 < phases.length; i++) {
    const y1 = Y(i) + PH.H / 2, y2 = Y(i + 1) - PH.H / 2;
    wire += `<path class="e" d="M${cx} ${y1} L${cx} ${y2 - 4}"/>` +
      arrowHead(cx, y2, 0, 1) +
      // The label is the leaving phase's own `exit_condition`: it is the guard that
      // makes this transition, in the spec's words and not in words derived here.
      phaseLabel(cx + 10, (y1 + y2) / 2 + 3, (phases[i] || {}).exit_condition);
  }

  const node = phases.map((p, i) => {
    const name = phaseName(phases, i);
    const max = (((p || {}).timing_bounds) || {}).max_steps;
    const bound = typeof max === "number" ? `≤ ${max} steps` : "no max_steps";
    const shown = name.length > 32 ? name.slice(0, 31) + "…" : name;
    const half = PH.W / 2, top = -PH.H / 2;
    return `<g id="ph${i}n" class="n" transform="translate(${cx},${Y(i)})">
      <title>${esc(name)} [${i}] — ${esc(bound)}
${esc((p || {}).description || "")}</title>
      <rect class="shape" x="${-half}" y="${top}" width="${PH.W}" height="${PH.H}" rx="4"/>
      <rect class="inner" x="${-half + 4}" y="${top + 4}" width="${PH.W - 8}"
            height="${PH.H - 8}" rx="3"/>
      <path class="mark" d="M${-half - 15} -7 L${-half - 15} 7 L${-half - 4} 0 Z"/>
      <text class="name" text-anchor="middle" y="-2">${esc(shown)}</text>
      <text class="sub" text-anchor="middle" y="13">${i} · ${esc(bound)}</text></g>`;
  }).join("");

  return `<svg viewBox="0 0 ${w} ${h}" style="width:${w}px;max-width:100%;height:auto"
    role="img">${wire}${node}</svg>`;
}

/* A transition label, left-anchored beside the arrow it belongs to. Wire data -- an
   operator-supplied spec's own text -- so it is escaped, and the untruncated form goes
   in the tooltip rather than being lost. */
function phaseLabel(x, y, label) {
  const full = raw(label === undefined || label === null ? "" : label);
  if (!full || full === "—") return "";
  const shown = full.length > PH.LBL ? full.slice(0, PH.LBL - 1) + "…" : full;
  return `<g><title>${esc(full)}</title><text class="elab" x="${x}" y="${y}"
    >${esc(shown)}</text></g>`;
}

/* The timing, which is the whole reason this is a second pane and not a second Büchi
   drawing. `step` counts the episode and `max_steps` bounds the phase, so the in-phase
   count is derived from the bound the monitor is measuring against -- and when the
   verdict does not report `steps_to_timeout` there is nothing to derive it from, which
   the pane says rather than showing the episode's step against a phase's bound. */
function phaseTiming(phases, i, v) {
  if (!v) return `<p class="dim" style="margin:8px 0 0">no verdict seen yet — no step,
    no budget and no risk to report.</p>`;
  const p = (i === null) ? null : (phases[i] || null);
  const max = p ? (((p.timing_bounds) || {}).max_steps) : null;
  const bound = typeof max === "number" ? max : null;
  const risk = v.risk || {};
  const left = risk.steps_to_timeout;
  const inPhase = (bound === null || typeof left !== "number") ? null : bound - left;
  const limit = p && typeof p.progress_violation_limit === "number"
    ? p.progress_violation_limit : null;
  const rows = [
    ["step", `${txt(v.step)} <span class="dim">this episode</span>`],
    ["in this phase", bound === null
      ? `<span class="dim">${p ? "this phase declares no timing_bounds.max_steps — unbounded"
                              : "no phase is active, so no bound applies"}</span>`
      : (inPhase === null
        ? `<span class="dim">? / ${bound} — the in-phase count is
           <code>max_steps</code> minus <code>risk.steps_to_timeout</code>, and this
           verdict reports no <code>steps_to_timeout</code></span>`
        : `${inPhase} <span class="dim">/ ${bound}</span>
           <div class="bar" style="margin-top:3px"><i style="width:${
             Math.max(0, Math.min(100, 100 * inPhase / Math.max(bound, 1)))}%"></i></div>`)],
    ["steps to timeout", typeof left === "number"
      ? `<span class="${bound !== null && left <= 0 ? "bad" : "ok"}">${left}</span>`
      : `<span class="dim">not reported</span>`],
    ["violations to fault", `${typeof risk.violations_to_fault === "number"
      ? `<span class="${risk.violations_to_fault <= 0 ? "bad" : "warn"}">${risk.violations_to_fault}</span>`
      : `<span class="dim">not reported</span>`} <span class="dim">of ${limit === null
        ? "no declared progress_violation_limit" : `${limit} allowed by this phase`}</span>`],
    ["severity", risk.severity === null || risk.severity === undefined
      ? `<span class="dim">none reported this tick</span>`
      : `<span class="bad">${esc(risk.severity)}</span>
         <span class="dim">the monitor graded this tick's risk</span>`],
  ];
  return `<table class="fixed" style="margin-top:8px"><colgroup><col style="width:32%">
    <col></colgroup>${rows.map(([k, cell]) =>
      `<tr><th class="wrap">${esc(k)}</th><td class="wrap">${cell}</td></tr>`).join("")}
    </table>`;
}

/* The guards of the phase we are in, with the truth the monitor reported for each and
   the propositions each one reads. `expr` and the phase name are an operator-supplied
   spec's own text and are escaped like every other wire field. */
function phaseGuards(phases, i, v) {
  const head = `<p class="dim" style="margin:10px 0 2px">guards of this phase — the
    expression as the spec authored it, the truth the monitor reported, and the
    propositions it reads with their live values</p>`;
  if (!v) return "";
  if (!("phase_guards" in v)) {
    return head + missing("verdict.phase_guards", "P0, then P4",
      "no producer reports which guard it acted on, so this build can show the phase " +
      "machine and its timing but no guard truth. This page will not evaluate the " +
      "expressions itself — a second evaluator here is where the same fault would be " +
      "invented rather than observed.");
  }
  const g = v.phase_guards;
  if (g === null || g === undefined) {
    return head + `<div class="missing">the verdict reports
      <code>phase_guards: null</code> — no phase is active this tick, so there are no
      guards to report.</div>`;
  }
  const guards = Array.isArray(g.guards) ? g.guards : [];
  const rows = guards.map(entry => {
    const value = (entry || {}).value;
    const cell = value === true ? `<span class="ok">true</span>`
      : value === false ? `<span class="dim">false</span>`
      // Neither true nor false: the tick did not answer this guard. Never rendered as
      // false -- "we did not check" and "it does not hold" are different facts.
      : `<span class="unk">not evaluated</span>`;
    const reads = apsInExpr((entry || {}).expr)
      .map(n => `<span class="key">${esc(n)}</span>=${apValue(n)}`).join(" ");
    return `<tr><td class="wrap">${txt((entry || {}).name)}</td><td class="wrap">${cell}</td>
      <td class="wrap"><span class="rule">${txt((entry || {}).expr)}</span><br>${reads ||
        '<span class="dim">reads no declared proposition</span>'}</td></tr>`;
  }).join("");
  const notes = [];
  if (g.phase !== undefined && g.phase !== (i === null ? null : phaseName(phases, i))) {
    notes.push(`these guards are reported for <span class="warn">${txt(g.phase)}</span>,
      which is not the phase highlighted above`);
  }
  // Two payloads, and they can be a tick apart: the guard truth is the verdict's and
  // the proposition values beside it are the observation's.
  if (S.obs && typeof S.obs.seq === "number" && S.obs.seq !== v.seq) {
    notes.push(`the values are observation seq ${txt(S.obs.seq)}, the guards verdict
      seq ${txt(v.seq)}`);
  }
  if (!guards.length) {
    notes.push("this phase declares no guards at all");
  }
  return head +
    `<table class="fixed"><colgroup><col style="width:27%"><col style="width:21%">
      <col></colgroup><tr><th class="wrap">guard</th><th class="wrap">this tick</th>
      <th class="wrap">expression → propositions it reads → live values</th></tr>
      ${rows}</table>` +
    (notes.length ? `<p class="warn" style="margin:6px 0 0">${notes.join(" · ")}</p>` : "");
}

/* Which declared propositions an expression reads. A word-boundary name match against
   the manifest's own AP names -- string matching, not evaluation, and it cannot invent
   a proposition the spec does not declare. The name is regex-escaped for the same
   reason `keysInRule` escapes a schema key: one metacharacter in wire data makes
   `new RegExp` throw, and an exception here is not a bad row, it is no pane. */
function apsInExpr(expr) {
  const body = String(expr === null || expr === undefined ? "" : expr)
    .replace(/'[^']*'|"[^"]*"/g, " ");
  return Object.keys((S.manifest || {}).atomic_propositions || {})
    .filter(n => new RegExp(`\\b${reEsc(n)}\\b`).test(body)).sort();
}

/* One proposition's live value, from the observation and from nowhere else. Absent from
   `ap_values`, listed in `unknown_aps`, or no observation at all: all three are UNKNOWN
   rather than false, which is the same rule pane 5 renders by. */
function apValue(name) {
  const o = S.obs;
  const known = o && o.ap_values && Object.prototype.hasOwnProperty.call(o.ap_values, name)
    && (o.unknown_aps || []).indexOf(name) < 0;
  return known
    ? (o.ap_values[name] ? `<span class="ok">true</span>` : `<span class="dim">false</span>`)
    : `<span class="unk">UNKNOWN</span>`;
}

/* == 8 · clock ============================================================== */

function renderClock() {
  const t = S.tick, o = S.obs, a = S.adapter;
  const declared = a ? a.tick_hz : null;
  const rows = [
    ["seq", txt((t || o || {}).seq)],
    ["t", num((t || o || {}).t, 3)],
    ["t0", t ? num(t.t0, 3) : missingInline("tick.t0")],
    ["tick_hz", t ? `${num(t.tick_hz)} ${declared && t.tick_hz !== declared
        ? `<span class="bad">≠ adapter's ${num(declared)}</span>` : ""}`
      : (declared !== null ? `${num(declared)} <span class="dim">(adapter's)</span>`
                           : missingInline("tick.tick_hz"))],
    ["Δ", declared ? `${num(1 / declared)} s` : "—"],
    ["mode", t ? esc(t.mode) : missingInline("tick.mode")],
    ["step", txt((o || {}).step)],
    ["clock source", o ? `<span class="key">${esc(o.clock)}</span>${
        o.clock === "internal" ? ' <span class="warn">free-running, not the clock service</span>' : ""}` : "—"],
    ["missed", txt((S.verdict || {}).missed_ticks)],
  ];
  $("h-tick").innerHTML = t
    ? `${txt(t.seq)} <span class="dim">@ ${num(t.tick_hz)} Hz ${esc(t.mode)}</span>`
    : `<span class="dim">no /monitor/tick</span>`;
  $("clock").innerHTML =
    `<table>${rows.map(([k, v]) => `<tr><th>${esc(k)}</th><td class="wrap">${v}</td></tr>`).join("")}</table>` +
    (t ? "" : `<p class="dim" style="margin:8px 0 0">no /monitor/tick seen on this
       namespace yet; seq and t above are the observation's own.</p>`);
}

function missingInline(f) { return `<span class="dim">no ${esc(f)}</span>`; }

// Outside #clock on purpose: renderClock rewrites that element on the next pulse, and
// a refusal that vanishes within a tick is a refusal the operator never reads.
$("step").onclick = async () => {
  const r = await api("/api/clock/step", { method: "POST", body: "{}" });
  $("step-note").innerHTML = r.status < 400
    ? `<p class="ok">stepped</p>`
    : `<p class="bad">step refused (${r.status}): ${esc(r.text.slice(0, 300))}</p>`;
};

/* == 9 · timing ============================================================= */

function renderTiming() {
  const v = S.verdict, o = S.obs;
  const budget = S.adapter ? 1000 / S.adapter.tick_hz : null;
  const reported = (v && v.timing) || (o && o.timing) || null;
  let html = "";
  if (reported) {
    const total = Object.values(reported).reduce((a, b) => a + b, 0);
    html += Object.entries(reported).map(([stage, ms]) =>
      `<div class="plot"><div class="lbl"><span>${esc(stage)}</span><span>${num(ms, 2)} ms</span></div>
       <div class="bar"><i style="width:${Math.min(100, budget ? 100 * ms / budget : 0)}%"></i></div></div>`).join("");
    html += `<p class="${budget && total > budget ? "bad" : "ok"}" style="margin:6px 0 0">
      ${num(total, 2)} ms of a ${num(budget, 1)} ms tick budget</p>`;
  } else {
    html += missing("verdict.timing", "P3 and P4",
      "no producer reports how long a tick cost it, so this pane cannot show where " +
      "the time went inside the monitor.");
  }
  const arr = S.arrivals;
  if (arr.length > 2) {
    const sorted = [...arr].sort((a, b) => a - b);
    const mean = arr.reduce((a, b) => a + b, 0) / arr.length;
    html += `<p class="dim" style="margin:10px 0 2px">measured in this browser, not
      reported by the monitor — the interval between verdicts arriving here, which is
      the pulse plus the whole path to this page:</p>
      <table><tr><th>mean</th><td>${num(mean, 1)} ms</td>
      <th>p50</th><td>${num(sorted[Math.floor(sorted.length / 2)], 1)} ms</td>
      <th>max</th><td>${num(sorted[sorted.length - 1], 1)} ms</td>
      <th>budget</th><td class="${budget && mean > budget * 1.2 ? "warn" : "dim"}">${num(budget, 1)} ms</td></tr></table>`;
  }
  $("timing").innerHTML = html;
}

boot();
</script>
</body>
</html>
