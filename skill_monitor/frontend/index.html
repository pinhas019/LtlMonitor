<!doctype html>
<!--
  The operator console. One file, no build step, no dependency: it is served by the
  gateway that serves the API, so it has the one origin that is allowed to open a
  stream and to set X-Skill-Monitor.

  Everything here is rendered from the wire. There is no navigation vocabulary in this
  file and no spec read from disk -- a robot whose schema this page has never seen
  renders the same way, which is the property the whole system is claimed on.

  Where a pane needs a field no producer publishes yet, it says so by name and says who
  owns it. It does not invent the field, and it does not hide the pane.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>skill monitor — console</title>
<style>
  :root {
    --bg:#12141a; --panel:#1a1d26; --line:#2b3040; --ink:#dfe3ee; --dim:#7f889e;
    --ok:#4ec9a0; --warn:#e0b25a; --bad:#e2626b; --acc:#6aa9ff; --unknown:#8b7fd0;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  header { position:sticky; top:0; z-index:5; background:var(--panel);
           border-bottom:1px solid var(--line); padding:8px 14px;
           display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
  header .k { color:var(--dim); font-size:11px; text-transform:uppercase;
              letter-spacing:.06em; display:block; }
  header .v { font-size:15px; }
  .grid { display:grid; gap:12px; padding:12px;
          grid-template-columns:repeat(auto-fit,minmax(430px,1fr)); align-items:start; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:6px; }
  section > h2 { margin:0; padding:8px 12px; font-size:12px; font-weight:600;
                 letter-spacing:.08em; text-transform:uppercase; color:var(--dim);
                 border-bottom:1px solid var(--line); display:flex;
                 justify-content:space-between; align-items:center; gap:8px; }
  section > .body { padding:10px 12px; overflow:auto; max-height:46vh; }
  table { border-collapse:collapse; width:100%; }
  th,td { text-align:left; padding:3px 8px 3px 0; vertical-align:top;
          border-bottom:1px solid #232734; white-space:nowrap; }
  th { color:var(--dim); font-weight:500; font-size:11px; }
  td.wrap, th.wrap { white-space:normal; overflow-wrap:anywhere; }
  /* Fixed layout so a long rule wraps inside its column instead of widening the table
     past the pane -- `width:100%` alone loses to a cell's min-content width. */
  table.fixed { table-layout:fixed; }
  .pill { border-radius:10px; padding:1px 8px; font-size:11px; display:inline-block;
          border:1px solid currentColor; }
  .ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
  .dim{color:var(--dim)} .acc{color:var(--acc)} .unk{color:var(--unknown)}
  .missing { color:var(--dim); border-left:2px solid var(--warn); padding:6px 10px;
             background:#20222c; border-radius:0 4px 4px 0; }
  .missing code { color:var(--warn); }
  textarea { width:100%; min-height:230px; background:#0e1016; color:var(--ink);
             border:1px solid var(--line); border-radius:4px; padding:8px;
             font:12px/1.5 ui-monospace,monospace; resize:vertical; }
  button { background:#242938; color:var(--ink); border:1px solid var(--line);
           border-radius:4px; padding:4px 10px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--acc); color:var(--acc); }
  button:disabled { opacity:.4; cursor:default; }
  canvas { display:block; width:100%; height:34px; background:#0e1016;
           border:1px solid var(--line); border-radius:3px; }
  .plot { margin-bottom:7px; }
  .plot .lbl { display:flex; justify-content:space-between; font-size:11px;
               color:var(--dim); padding-bottom:1px; }
  .bar { height:7px; background:#0e1016; border-radius:3px; overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--acc); }
  .rule { color:var(--dim); white-space:normal; }
  .key { color:var(--acc); }
  .mock { color:#12141a; background:var(--warn); font-weight:700; padding:2px 8px;
          border-radius:3px; letter-spacing:.08em; }

  /* pane 3's echo half. One picker, because the echo is one source at a time, and a
     frame drawn at its own size: a 160x120 camera frame stretched to the pane's width
     is a picture of the pane and not of what the robot sees. `stale` is a class on a
     block that is already in the document -- the age is recomputed every tick and the
     frame is not redrawn for it -- and it exists so that the last frame which arrived
     cannot go on looking like the one arriving now. It dims and greys, which is a
     second signal beside the words above it and not a substitute for them. */
  select { background:#242938; color:var(--ink); border:1px solid var(--line);
           border-radius:4px; padding:3px 6px; font:inherit; max-width:100%; }
  select:hover:enabled { border-color:var(--acc); }
  select:disabled { opacity:.4; cursor:default; }
  #echo { border-top:1px solid var(--line); margin-top:9px; padding-top:8px; }
  #echo .pick { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  #echo .frame { display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap; }
  #echo .frame > table { width:auto; min-width:190px; flex:1 1 190px; }
  #echo img { display:block; width:auto; height:auto; max-width:320px;
              image-rendering:pixelated; background:#0e1016;
              border:1px solid var(--line); border-radius:3px; }
  #echo pre { margin:5px 0 0; padding:7px 9px; background:#0e1016; color:var(--ink);
              border:1px solid var(--line); border-radius:3px; max-height:210px;
              overflow:auto; white-space:pre-wrap; overflow-wrap:anywhere;
              font:12px/1.45 ui-monospace,monospace; }
  #echo .missing { margin-top:7px; }
  #echo-body { margin-top:6px; }
  #echo-body.stale img { opacity:.28; filter:grayscale(1); }
  #echo-body.stale table, #echo-body.stale pre { opacity:.5; }

  /* The monitor's own state, and the controls that change it. Both live in the sticky
     header rather than in a pane, because an operator who opens this page while the
     monitor is paused has to read that before anything else -- and a pane is something
     you scroll to.

     Loud, and never colour alone. The state is spelt out in words and in capitals, with
     a glyph and a heavy edge, so it survives a monochrome screen, a colour-blind reader
     and a photograph of the screen sent to somebody else. */
  header .row { flex:1 0 100%; }
  .strip { display:flex; gap:8px; align-items:center; flex-wrap:wrap;
           border-top:1px solid var(--line); padding-top:6px; margin-top:3px; }
  .strip .lead { color:var(--dim); font-size:11px; text-transform:uppercase;
                 letter-spacing:.06em; }
  .banner { display:flex; gap:12px; align-items:flex-start; border-radius:4px;
            padding:7px 11px; margin-top:4px; }
  .banner .mark { font-weight:700; font-size:14px; letter-spacing:.07em;
                  white-space:nowrap; }
  .banner .missing { margin:0; }
  .banner b { color:var(--ink); }
  .banner.alarm { color:var(--bad); background:#2b1a1e; border:1px solid var(--bad);
                  border-left:12px solid var(--bad); }
  .banner.unreported { color:var(--warn); background:#26221a;
                       border:1px solid var(--warn);
                       border-left:12px solid var(--warn); }
  .banner.calm { color:var(--dim); background:#171a22; border:1px solid var(--line);
                 border-left:12px solid var(--ok); padding:3px 11px; }

  /* pane 6. The *shape* carries the kind -- a second outline for accepting, a square
     for an absorbing sink -- so the three are told apart on a monochrome screen, by a
     colour-blind operator, and in a printed screenshot. Colour only agrees with it.
     Everything here is a class on a node that is already in the document: a verdict
     arrives at the tick rate, and re-laying-out three graphs at that rate would fight
     the same pulse that feeds panes 3 to 5. */
  #automaton .aut { border-bottom:1px solid #232734; margin-bottom:8px; }
  #automaton .aut .lbl { display:flex; gap:12px; justify-content:space-between;
                         font-size:11px; padding:2px 0; }
  #automaton .e { fill:none; stroke:var(--line); stroke-width:1.3; }
  #automaton .head { fill:var(--line); stroke:none; }
  #automaton .elab { fill:var(--dim); font-size:10px; }
  #automaton .n .shape { fill:#0e1016; stroke:var(--dim); stroke-width:1.5; }
  #automaton .n .inner { fill:none; stroke:var(--dim); stroke-width:1.2; }
  #automaton .n text { fill:var(--ink); font-size:11px; }
  /* Sink first so accepting wins when a state is both: an accepting absorbing state is
     the good end of a run and must not be painted in the colour of the bad one. The
     square already says "nothing after this changes it". */
  #automaton .n.sink .shape, #automaton .n.sink .inner { stroke:var(--bad); }
  #automaton .n.acpt .shape, #automaton .n.acpt .inner { stroke:var(--ok); }
  #automaton .n.seen .shape { fill:#232a3c; }
  #automaton .n.cur  .shape { fill:var(--acc); stroke:var(--ink); stroke-width:2.5; }
  #automaton .n.cur  text   { fill:#12141a; font-weight:700; }

  /* pane 7. Same discipline as pane 6 and for the same reasons: the geometry is laid
     out once per manifest and a verdict only toggles a class, and *where we are* is
     carried by shape -- a second outline and a caret pointing at the box -- so it
     survives a monochrome screen and a colour-blind reader. Both extra marks are in
     the document from the start and hidden with `display`, so lighting a phase stays a
     class swap rather than a redraw. */
  #phase .e { fill:none; stroke:var(--line); stroke-width:1.3; }
  #phase .head { fill:var(--line); stroke:none; }
  #phase .elab { fill:var(--dim); font-size:10px; }
  #phase .n .shape { fill:#0e1016; stroke:var(--dim); stroke-width:1.5; }
  #phase .n .inner, #phase .n .mark { display:none; }
  #phase .n .name { fill:var(--ink); font-size:11px; }
  #phase .n .sub  { fill:var(--dim); font-size:9px; }
  #phase .n.cur .inner, #phase .n.cur .mark { display:inline; }
  #phase .n.cur .shape { fill:#232a3c; stroke:var(--acc); stroke-width:2.5; }
  #phase .n.cur .inner { fill:none; stroke:var(--acc); stroke-width:1.2; }
  #phase .n.cur .mark  { fill:var(--acc); stroke:none; }
  #phase .n.cur .name  { font-weight:700; }
</style>
</head>
<body>

<header>
  <div><span class="k">skill</span><span class="v" id="h-skill">—</span></div>
  <div><span class="k">verdict</span><span class="v" id="h-verdict">—</span></div>
  <div><span class="k">intervention</span><span class="v" id="h-action">—</span></div>
  <div><span class="k">phase</span><span class="v" id="h-phase">—</span></div>
  <div><span class="k">step / max</span><span class="v" id="h-step">—</span></div>
  <div><span class="k">tick</span><span class="v" id="h-tick">—</span></div>
  <div style="margin-left:auto" id="h-badges"></div>

  <!-- Pane 0, in everything but the numbering: what the monitor's own state is, and
       the four commands that change it. In the header because the banner must be read
       without scrolling to the strip that caused it. The buttons are markup rather than
       generated, so the only thing that ever reaches this strip from the wire is a
       refusal, and that goes through esc(). -->
  <div class="row" id="mon-banner"></div>
  <div class="row strip">
    <span class="lead">monitor</span>
    <button id="cmd-arm">arm <span class="dim">· restarts the episode</span></button>
    <button id="cmd-reset">reset <span class="dim">· restarts the episode</span></button>
    <button id="cmd-pause">pause <span class="dim">· stops the watching</span></button>
    <button id="cmd-resume">resume</button>
    <span id="cmd-note"></span>
    <span id="cmd-why"></span>
  </div>
</header>

<div class="grid">

  <section>
    <h2>1 · description and spec <span><button id="reload">apply · restarts the episode</button></span></h2>
    <div class="body">
      <p id="spec-desc" class="dim wrap" style="margin:0 0 8px"></p>
      <textarea id="spec-text" spellcheck="false"></textarea>
      <div style="margin-top:6px" id="spec-status"></div>
    </div>
  </section>

  <section>
    <h2>2 · loaded config</h2>
    <div class="body" id="config"></div>
  </section>

  <section>
    <h2>3 · input data <span class="dim" id="in-note"></span></h2>
    <div class="body">
      <div id="inputs"></div>
      <!-- The echo half. Built by renderEcho() from the adapter's own sources, so the
           picker offers exactly what this robot declares and nothing this page knows
           about any particular robot. -->
      <div id="echo"></div>
    </div>
  </section>

  <section>
    <h2>4 · plots <span class="dim">last 180 ticks</span></h2>
    <div class="body" id="plots"></div>
  </section>

  <section>
    <h2>5 · atomic propositions <span class="dim">rule → keys → value</span></h2>
    <div class="body" id="aps"></div>
  </section>

  <section>
    <h2>6 · automaton</h2>
    <div class="body" id="automaton"></div>
  </section>

  <section>
    <h2>7 · phase machine <span class="dim">state · timing · guards</span></h2>
    <div class="body" id="phase"></div>
  </section>

  <section>
    <h2>8 · clock <span><button id="step">step</button></span></h2>
    <div class="body"><div id="clock"></div><div id="step-note"></div></div>
  </section>

  <section>
    <h2>9 · timing</h2>
    <div class="body" id="timing"></div>
  </section>

</div>

<script>
"use strict";

const HDR = { "X-Skill-Monitor": "1", "Content-Type": "application/json" };
/* `api.SCHEMA_VERSION`. The page builds two payloads -- a command and a pushed spec --
   and a command carries the envelope version like every other frame on the wire. Pinned
   against the constant by tests/test_web_ui.py, so a bump there fails here. */
const SCHEMA_VERSION = 1;
const S = {
  seg: null, manifest: null, adapter: null, status: null,
  tick: null, obs: null, verdict: null,
  hist: [],            // recent observations, for the plots
  arrivals: [],        // wall-clock ms between verdicts, measured here
  dropped: 0, connected: false,
  // Pane 6. `key` is the manifest's graphs as drawn, so the SVG is rebuilt when the
  // spec changes and never on a verdict; `trace` is the states this page has *seen*,
  // one array per graph, and `from` is the step it started seeing them at. Neither is
  // history: the page was not here before it connected and must not draw as if it was.
  aut: { key: null, trace: [], from: null, last: null },
  // Pane 7. Same idea, one field: the phases as drawn, so the machine is laid out once
  // per manifest and a verdict only moves the highlight.
  ph: { key: null },
  // The monitor's own state and this page's ability to change it. `status` is the last
  // /monitor/status payload and is the ONLY thing the state is ever read from -- see
  // renderStateBanner. `route` is whether this build has a status route at all, `post`
  // is whether it has a command route, and `why` is what the last GET said, so the
  // degrade banner can name which silence this is.
  mon: { status: null, route: null, post: null, postStatus: null, busy: false,
         why: "this console has not asked yet." },
  // Pane 3's echo half. `on` is the source this console last *successfully* asked for
  // and null is off, which is what it is until somebody picks one -- a request that was
  // refused turned nothing on and must not move it. `key` is the picker as drawn, so
  // the control is built once per adapter and never rebuilt under a frame. `frame` is
  // the last /monitor/raw_echo payload and is dropped whenever it stops describing what
  // was asked for: on a stop, on a switch, and across a reconnect. `route`/`status` are
  // whether this build has an ingress route at all and what it answered; `verb` is
  // which of the candidate route names replied, once one has.
  ech: { key: null, on: null, frame: null, since: null, gap: false,
         route: null, status: null, busy: false },
};
const PLOT_N = 180;

const $ = id => document.getElementById(id);
/* `'` is escaped as well as `"` so that a single-quoted attribute stays safe by
   construction: today none of them take interpolated data, and nobody adding the first
   one should have to know that. */
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
/* `raw` stringifies for a textContent sink; `txt` is the same thing for an innerHTML
   one, and everything below writes innerHTML. A wire field is not markup: the gateway
   keeps a cross-origin page from ever reaching these routes, but a publisher already on
   the ROS graph is not the attacker that defends against, and a `skill_name` of
   `<img onerror=...>` should render as those characters rather than run. */
const raw = (s) => (s === null || s === undefined) ? "—" : String(s);
const txt = (s) => esc(raw(s));
/* Numbers pass through unescaped because they are numbers; anything else took the
   `txt` path and is escaped. */
const num = (v, d = 3) => (typeof v === "number" && isFinite(v)) ? +v.toFixed(d) : txt(v);

async function api(path, opts) {
  const r = await fetch(path, Object.assign({ headers: HDR }, opts || {}));
  const body = await r.text();
  let parsed = null;
  try { parsed = JSON.parse(body); } catch (e) { /* keep the text */ }
  return { status: r.status, body: parsed, text: body };
}

/* -- a field nobody publishes yet is named, with its owner ------------------ */
function missing(field, owner, why) {
  return `<div class="missing">no <code>${esc(field)}</code> on the wire.
    ${esc(why)}<br><span class="dim">${esc(owner)} publishes it; this pane fills in
    the moment it does. Nothing here is inferred in the meantime.</span></div>`;
}

/* == bootstrap ============================================================== */

async function boot() {
  renderMonitor();                 // disabled, and saying why, before anything is known
  renderEcho();                    // and the same for the echo picker
  const health = await api("/api/health");
  const monitors = await api("/api/monitors");
  const list = (monitors.body && monitors.body.monitors) || [];
  renderBadges(health.body);
  if (!list.length) {
    $("config").innerHTML = missing("monitor", "P4",
      "the gateway has discovered no namespace advertising /monitor/verdict.");
    setTimeout(boot, 2000);
    return;
  }
  S.seg = list[0].path;
  S.services = (monitors.body || {}).services;
  await refreshLatched();
  await refreshMonitorStatus();
  connect();
}

async function refreshLatched() {
  for (const [verb, slot] of [["manifest", "manifest"], ["adapter", "adapter"],
                              ["spec_status", "status"]]) {
    const r = await api(`/api/monitors/${S.seg}/${verb}`);
    S[slot] = r.status === 200 ? r.body : null;
  }
  renderSpec(); renderConfig(); renderStatus(); renderAutomaton(); renderPhases();
  renderEcho();
}

function connect() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const ws = new WebSocket(`${proto}//${location.host}/api/monitors/${S.seg}/stream`);
  ws.onopen = () => {
    S.connected = true;
    // A reconnect is a gap: the verdicts in it were not witnessed, so the path pane 6
    // claims restarts here rather than joining across the hole.
    S.aut.key = null;
    renderBadges();
    // And the state held across that gap is a claim about a period this page was not
    // watching -- another operator may have paused the monitor inside it. The latched
    // topic is re-read rather than trusted, which is the same reason it is latched.
    refreshMonitorStatus();
    // The echo is a request this console made to an evaluator that may have restarted
    // inside the gap, and the frame it last showed is older than the gap either way.
    // The frame goes; the request is *not* silently re-sent, because turning a point
    // cloud back on is the operator's decision and not this page's.
    if (S.ech.on !== null) S.ech.gap = true;
    S.ech.frame = null;
    renderEchoFrame();
  };
  ws.onclose = () => { S.connected = false; renderBadges(); setTimeout(connect, 1500); };
  ws.onmessage = ev => {
    let frame;
    try { frame = JSON.parse(ev.data); } catch (e) { return; }
    if (frame.dropped) S.dropped = frame.dropped;
    const p = frame.payload;
    if (!p) return;
    if (frame.topic.endsWith("/tick")) {
      // The echo's age is measured in ticks, so the clock is what moves it -- and it
      // has to go on moving while the monitor is paused, which is exactly when a stale
      // frame would otherwise sit there looking live.
      S.tick = p; renderClock(); renderStateBanner(); renderEchoAge();
    }
    else if (frame.topic.endsWith("/observation")) { S.obs = p; onObservation(p); }
    else if (frame.topic.endsWith("/verdict")) { S.verdict = p; onVerdict(p); }
    // `/monitor/raw_echo`, which reaches a browser only on a build whose gateway has
    // `api.RAW_ECHO` in STREAM_TOPICS. `/monitor/raw_echo_request` is the outbound half
    // and never arrives here; it does not end with `/raw_echo` either.
    else if (frame.topic.endsWith("/raw_echo")) { onRawEcho(p); }
    else if (frame.topic.endsWith("/spec_status")) { S.status = p; renderStatus(); }
    // Latched *and* streamed, and both are needed: latched so a console opening
    // mid-pause learns the truth on its first request, streamed so a console already
    // open learns that another operator has just paused the monitor. `/spec_status` is
    // matched above and does not end with `/status`, so the order here is clarity and
    // not a dependency.
    else if (frame.topic.endsWith("/status")) { onMonitorStatus(p); }
  };
}

function onObservation(o) {
  S.hist.push(o);
  if (S.hist.length > PLOT_N) S.hist.shift();
  renderInputs(); renderPlots(); renderAps(); renderClock(); renderEchoAge();
}

function onVerdict(v) {
  const now = performance.now();
  if (S.lastAt) S.arrivals.push(now - S.lastAt);
  if (S.arrivals.length > 60) S.arrivals.shift();
  S.lastAt = now;
  // Pane 7 renders here and not on the observation, so the guard truth it shows and the
  // proposition values it shows beside it are read off the same pulse. They are two
  // payloads and could be one tick apart; the pane says so when they are.
  renderHeader(); renderAutomaton(); renderPhases(); renderTiming();
}

/* == header ================================================================= */

function verdictClass(v) {
  return { SATISFIED: "ok", VIOLATED: "bad", UNDECIDED: "dim",
           INCONCLUSIVE_NO_DATA: "unk" }[v] || "dim";
}
const ACTION_CLASS = { CONTINUE: "ok", WARN: "warn", SLOW: "warn",
                       REPLAN: "warn", HALT: "bad", ABORT: "bad" };

function renderHeader() {
  const v = S.verdict; if (!v) return;
  $("h-skill").textContent = v.skill_name || "—";
  $("h-verdict").innerHTML = `<span class="${verdictClass(v.verdict)}">${esc(v.verdict)}</span>`;
  const a = (v.intervention || {}).action;
  $("h-action").innerHTML =
    `<span class="${ACTION_CLASS[a] || "dim"}">${txt(a)}</span>` +
    ` <span class="dim">conf ${num((v.intervention || {}).confidence, 2)}</span>`;
  $("h-phase").textContent = `${raw(v.phase)}${v.phase_index === null ? "" : ` [${raw(v.phase_index)}]`}`;
  const max = phaseMaxSteps(v.phase_index);
  const left = (v.risk || {}).steps_to_timeout;
  // `step` counts the episode; `max_steps` bounds the *phase*. Comparing them directly
  // reads as "72 / 120" when the phase is 42 ticks old, so the in-phase count is
  // derived from the bound the monitor is actually measuring against.
  const inPhase = (max === null || typeof left !== "number") ? null : max - left;
  $("h-step").innerHTML = max === null
    ? `${txt(v.step)} <span class="dim">/ unbounded</span>`
    : `${txt(inPhase)}<span class="dim">/${max} in phase · ${txt(left)} left ·
       ${txt(v.step)} this episode</span>`;
  renderBadges();
}

function phaseMaxSteps(i) {
  const phases = (S.manifest || {}).execution_phases;
  if (!Array.isArray(phases) || i === null || i === undefined || !phases[i]) return null;
  const b = (phases[i].timing_bounds || {}).max_steps;
  return typeof b === "number" ? b : null;
}

function renderBadges(health) {
  if (health) S.health = health;
  const svc = ((S.health || {}).services || {});
  const ros = svc.ros || {};
  const bits = [];
  if (ros.mock) bits.push(`<span class="mock">MOCK DATA</span>`);
  bits.push(`<span class="pill ${S.connected ? "ok" : "bad"}">${S.connected ? "stream" : "no stream"}</span>`);
  if (S.dropped) bits.push(`<span class="pill warn">${S.dropped} dropped</span>`);
  if ((S.verdict || {}).missed_ticks) {
    bits.push(`<span class="pill warn">${S.verdict.missed_ticks} missed ticks</span>`);
  }
  $("h-badges").innerHTML = bits.join(" ");
}

/* == 0 · the monitor's state, and the controls that change it ===============

   Pausing the monitor does not pause the robot. It stops the only thing that was
   watching the robot, and the robot carries on: no verdicts, no failure modes, no
   intervention. That is why the controls are not a media player and why the state gets
   a banner in the sticky header rather than a pill in a pane.

   **The state comes off `/monitor/status` and off nothing else.** Never from the absence
   of verdicts: a paused monitor publishes none and a dead monitor publishes none, and
   reading that silence as "running" is precisely the fault this pane exists to prevent.
   A build with no status topic gets the placeholder that names the field and its owner,
   the same as every other unreported field on this page -- and the controls keep
   working, because the command route does not depend on the status topic. */

/* `api.COMMANDS`, in the order the strip lays them out. Pinned against the constant by
   tests/test_web_ui.py: a command added to the contract and not to this list is a
   control the console silently does not offer. */
const COMMANDS = ["arm", "reset", "pause", "resume"];

/* What each one does, and -- for the three that cannot be taken back -- what the
   operator is being asked to agree to. `arm` and `reset` throw the episode away;
   `pause` leaves the robot moving with nothing watching it. `resume` is the one that
   puts the watching back, so it asks nothing. */
const CMD = {
  arm: { confirm: "arm restarts the episode.\n\n" +
      "The monitor's step counter goes back to zero, every automaton returns to its " +
      "initial state and the phase machine returns to the first phase. The history " +
      "of the episode now running is discarded and cannot be recovered from this " +
      "page.\n\nArm the monitor?" },
  reset: { confirm: "reset restarts the episode.\n\n" +
      "The monitor's step counter goes back to zero, every automaton returns to its " +
      "initial state and the phase machine returns to the first phase. The history " +
      "of the episode now running is discarded and cannot be recovered from this " +
      "page.\n\nReset the monitor?" },
  pause: { confirm: "PAUSE STOPS THE MONITORING. IT DOES NOT STOP THE ROBOT.\n\n" +
      "While the monitor is paused it steps no automaton, evaluates no phase guard, " +
      "publishes no verdict and raises no failure mode. The robot keeps doing " +
      "whatever it is doing, and nothing is watching it. It will look exactly like a " +
      "monitor that has died.\n\nPause the monitor?" },
  resume: {},
};

/* The four states the contract admits, what each one means for the robot, and which of
   them are alarms. Only `running` is not: everything else means nobody is watching, and
   an unrecognised state is treated as unknown rather than as running. */
const MON_STATES = {
  running: { alarm: false, mark: "MONITORING",
             says: "the monitor is stepping and judging every tick." },
  paused: { alarm: true, mark: "NOT MONITORING",
            says: "the monitor has stopped stepping. It publishes no verdict, evaluates " +
                  "no guard and raises no failure mode. The robot is not stopped by " +
                  "this — it keeps running, unwatched." },
  halted: { alarm: true, mark: "NOT MONITORING",
            says: "the monitor has stopped and is judging nothing further. Whatever the " +
                  "robot does from here is unwatched." },
  idle: { alarm: true, mark: "NOT MONITORING",
          says: "the monitor is running no episode, so nothing is being judged. A robot " +
                "that is moving is moving unwatched." },
};

/* A background tab is where an operator leaves this page. The state goes in the title so
   a pause is legible from the tab strip, without the tab having to be looked at. */
const TITLE = document.title;
function setTitleMark(mark) {
  document.title = mark ? `⚠ ${mark} — ${TITLE}` : TITLE;
}

function renderMonitor() { renderStateBanner(); updateControls(); }

/* The latched read. 200 is a state; a 404 is one of two different silences and the
   banner says which, because "this build has no such route" and "this monitor has never
   published one" are different facts about who to go and ask. */
async function refreshMonitorStatus() {
  if (!S.seg) return;
  const r = await api(`/api/monitors/${S.seg}/status`);
  const body = r.body || {};
  if (r.status === 200) {
    onMonitorStatus(r.body);
    return;
  }
  S.mon.status = null;
  if (r.status === 404) {
    // The gateway's 404 for an unknown verb carries no `topic`; its 404 for a topic the
    // monitor has not published names the topic it looked for.
    S.mon.route = !!body.topic;
    S.mon.why = body.topic
      ? "the route exists and this monitor has never published a status."
      : "this build's gateway has no such route: the topic is not in " +
        "api.LATCHED_TOPICS, so no GET is derived for it.";
  } else {
    // Anything else is a refusal to answer, not an answer. Nothing is concluded from it.
    S.mon.why = `GET .../status answered ${txt(r.status)}, which is a refusal to ` +
      "answer rather than an answer; this page concludes nothing from it.";
  }
  renderMonitor();
}

function onMonitorStatus(payload) {
  S.mon.status = (payload && typeof payload === "object") ? payload : null;
  S.mon.route = true;
  if (!S.mon.status) {
    S.mon.why = "the status route answered with something that is not an object.";
  }
  renderMonitor();
}

/* -- the banner ------------------------------------------------------------ */

function renderStateBanner() {
  const box = $("mon-banner"), s = S.mon.status;

  if (!s) {
    setTitleMark("STATE UNREPORTED");
    box.className = "row banner unreported";
    box.innerHTML =
      `<div class="mark">⚠ STATE UNREPORTED</div><div>` +
      missing("/monitor/status", "P0, then P4",
        "this build does not report whether the monitor is running, paused, halted or " +
        "idle — " + S.mon.why) +
      `<div class="dim" style="margin-top:5px">Nothing on this page infers it. A paused
        monitor publishes no verdicts and a dead one publishes none either, so a quiet
        wire is not evidence of a running monitor. The controls below still work: the
        command route does not depend on this topic.</div></div>`;
    return;
  }

  const name = typeof s.state === "string" ? s.state : null;
  const known = name !== null &&
    Object.prototype.hasOwnProperty.call(MON_STATES, name);
  const meta = known ? MON_STATES[name] : null;
  const alarm = !known || meta.alarm;
  const mark = known ? meta.mark : "STATE UNKNOWN";
  const says = known ? meta.says
    : (s.state === null || s.state === undefined
      ? `the status on the wire carries no <code>state</code> at all. It is read as
         unknown and never as running.`
      : `the status reports a state this console has no meaning for. It is read as
         unknown and never as running, and nothing on this page assumes the monitor is
         watching.`);

  setTitleMark(alarm ? mark : null);
  box.className = "row banner " + (alarm ? "alarm" : "calm");
  box.innerHTML =
    `<div class="mark">${alarm ? "⚠ " : ""}${esc(mark)}</div>
     <div><b>monitor ${esc(raw(s.state).toUpperCase())}</b> — ${sinceText()}.
       <span class="dim">reason:</span> ${s.reason === null || s.reason === undefined
         ? `<span class="dim">none given</span>` : esc(String(s.reason))}
       <div class="dim" style="margin-top:3px">${says}</div></div>`;
}

/* How long this state has held, in the unit the wire gives: ticks. `since_seq` against
   the newest seq that has reached this page. Never a wall-clock duration measured here
   -- this browser's clock and the monitor's are not the same clock, and under replay
   they are not even the same rate. */
function sinceText() {
  const since = (S.mon.status || {}).since_seq;
  if (typeof since !== "number") {
    return `held for an unreported length of time <span class="dim">(the status carries
      no <code>since_seq</code> to measure from)</span>`;
  }
  const now = latestSeq();
  if (now === null) {
    return `since seq ${txt(since)} <span class="dim">(no tick, observation or verdict
      has reached this page, so there is nothing to measure it against)</span>`;
  }
  const ticks = now - since;
  if (ticks < 0) {
    return `since seq ${txt(since)} <span class="dim">(which is ahead of the newest seq
      this page has seen, ${txt(now)} — no duration is derived from that)</span>`;
  }
  const hz = (S.adapter || {}).tick_hz;
  const secs = (typeof hz === "number" && hz > 0) ? ` ≈ ${num(ticks / hz, 1)} s` : "";
  // Concatenated rather than folded across lines: a template literal's own indentation
  // renders as a space, and "≈ 43 s , since seq 248" is a typo on the one line of this
  // page an operator reads under pressure.
  return `for ${ticks} tick${ticks === 1 ? "" : "s"}${secs}` +
    `<span class="dim">, since seq ${txt(since)} (latest ${txt(now)})</span>`;
}

/* The newest seq this page has been told about, from the clock first. All three are the
   same axis -- the tick's -- and the observation and verdict are fallbacks for a build
   whose stream does not carry /monitor/tick. */
function latestSeq() {
  for (const p of [S.tick, S.obs, S.verdict]) {
    if (p && typeof p.seq === "number") return p.seq;
  }
  return null;
}

/* -- the control strip ----------------------------------------------------- */

/* Why a command cannot be sent, or null when one can. A dead button that looks live is
   worse than an absent one, so the same answer both disables the buttons and is printed
   beside them.

   Not on this list: the monitor's state. A build that reports no state can still be
   armed, reset, paused and resumed -- the command route is independent of the status
   topic -- and disabling the controls because the *state* is unknown would take the
   robot's only stop button away over a missing field. The banner says the state is
   unreported; the controls stay live. */
function controlRefusal() {
  if (!S.seg) {
    return "no monitor is selected — the gateway has discovered no namespace to " +
      "address a command to.";
  }
  if (S.mon.post === "absent") {
    return `this gateway serves no POST .../command route — it answered ` +
      `${txt(S.mon.postStatus)} — so there is nowhere to send one.`;
  }
  if (S.mon.busy) return "the last command has not been answered yet.";
  return null;
}

function updateControls() {
  const why = controlRefusal();
  for (const c of COMMANDS) $("cmd-" + c).disabled = why !== null;
  $("cmd-why").innerHTML = why
    ? `<span class="warn">no control:</span> <span class="dim">${esc(why)}</span>` : "";
}

/* One command out, and what came back. Reported the way the clock's step button reports
   a refusal -- the status and the body, not a swallowed failure -- because a control
   that fails silently is a control an operator believes worked.

   A 202 is "published", and the note says so: what the monitor did with the command is
   what /monitor/status reports, and this page does not move its own banner on the
   strength of having sent something. */
async function command(cmd) {
  const ask = (CMD[cmd] || {}).confirm;
  if (ask && !window.confirm(ask)) {
    $("cmd-note").innerHTML =
      `<span class="dim">${esc(cmd)} cancelled — nothing was sent.</span>`;
    return;
  }
  S.mon.busy = true;
  updateControls();
  $("cmd-note").innerHTML = `<span class="dim">sending ${esc(cmd)}…</span>`;
  const r = await api(`/api/monitors/${S.seg}/command`, {
    method: "POST",
    body: JSON.stringify({ schema_version: SCHEMA_VERSION, command: cmd }),
  });
  S.mon.busy = false;
  // 404 and 405 are the route not being there; every other refusal is this request
  // being refused, and the buttons stay live for the next one.
  if (r.status === 404 || r.status === 405) {
    S.mon.post = "absent";
    S.mon.postStatus = r.status;
  } else if (r.status < 400) {
    S.mon.post = "ok";
  }
  if (r.status < 400) {
    $("cmd-note").innerHTML =
      `<span class="ok">${esc(cmd)} published (${txt(r.status)})</span>
       <span class="dim">— what the monitor does with it is what its status reports;
       this page does not assume.</span>`;
    if (cmd === "arm" || cmd === "reset") {
      // The episode this page was watching is over, and its history was witnessed
      // rather than fetched: there is nowhere to get it back from and nothing it now
      // describes. Discarded only on a command that actually went out.
      S.hist = []; S.arrivals = []; S.aut.key = null;
      // The echoed frame belonged to the episode that was just thrown away. What is
      // *echoing* does not change -- that is a standing request to the evaluator and
      // not a piece of this episode's history -- so the request is left alone and only
      // the frame goes.
      S.ech.frame = null; renderEchoFrame();
    }
  } else {
    $("cmd-note").innerHTML =
      `<span class="bad">${esc(cmd)} refused (${txt(r.status)}):
       ${esc(r.text.slice(0, 300))}</span>`;
  }
  updateControls();
  // The state is the monitor's answer, not the gateway's receipt. Re-read rather than
  // assumed -- and if the topic is not on this wire, nothing changes and the banner goes
  // on saying the state is unreported.
  refreshMonitorStatus();
}

for (const c of COMMANDS) $("cmd-" + c).onclick = () => command(c);

/* == 1 · description and spec =============================================== */

function renderSpec() {
  const m = S.manifest;
  if (!m) { $("spec-text").value = ""; return; }
  $("spec-desc").textContent = m.description || "(the spec declares no description)";
  const spec = Object.assign({}, m);
  // The envelope the manifest is wrapped in is the wire's, not the spec's: pushing it
  // back would be asking the monitor to load a document it never authored. `automata`
  // goes with them -- it is compiled *from* the formulas below, not authored beside
  // them, and echoing it back would have an operator editing a graph nobody reads.
  for (const k of ["schema_version", "seq", "t", "phases", "source", "automata"]) {
    delete spec[k];
  }
  if (document.activeElement !== $("spec-text")) {
    $("spec-text").value = JSON.stringify(spec, null, 2);
  }
}

/* `spec_status` carries ok, problems and skill_name and nothing else -- the field set
   is closed. Which spec is loaded is the manifest's `source`, rendered in pane 2; a
   `via` here would read `via —` against every real monitor on the wire. */
function renderStatus() {
  const s = S.status;
  if (!s) { $("spec-status").innerHTML = `<span class="dim">no spec_status latched</span>`; return; }
  const problems = s.problems || [];
  $("spec-status").innerHTML = s.ok && !problems.length
    ? `<span class="ok">accepted</span> <span class="dim">${txt(s.skill_name)}</span>`
    : `<span class="bad">rejected</span><ul style="margin:4px 0 0 16px;padding:0">` +
      problems.map(p => `<li class="bad">${esc(p)}</li>`).join("") + `</ul>`;
}

$("reload").onclick = async () => {
  const btn = $("reload"); btn.disabled = true;
  let spec;
  try { spec = JSON.parse($("spec-text").value); }
  catch (e) {
    $("spec-status").innerHTML = `<span class="bad">not JSON: ${esc(e.message)}</span>`;
    btn.disabled = false; return;
  }
  const r = await api(`/api/monitors/${S.seg}/spec`, {
    method: "POST", body: JSON.stringify(spec),
  });
  S.status = r.body && r.body.problems !== undefined ? r.body : (r.body || null);
  renderStatus();
  await refreshLatched();
  S.hist = []; S.arrivals = [];
  btn.disabled = false;
};

/* == 2 · loaded config ====================================================== */

function renderConfig() {
  const a = S.adapter, m = S.manifest, svc = (S.services || {});
  if (!a) { $("config").innerHTML = missing("/monitor/adapter", "P3",
    "the evaluator has not latched what this robot can observe."); return; }
  const rows = [
    ["adapter", esc(a.adapter)],
    ["describes", `<span class="dim wrap">${esc(a.doc || "—")}</span>`],
    ["tick_hz", `${num(a.tick_hz)} <span class="dim">Δ = ${num(1 / a.tick_hz)} s</span>`],
    ["spec source", txt((m || {}).source)],
    ["schema keys", `${Object.keys(a.schema || {}).length}`],
    ["ros", `${svc.ros && svc.ros.available ? '<span class="ok">available</span>' : '<span class="bad">absent</span>'}
             <span class="dim wrap">${esc((svc.ros || {}).detail || "")}</span>`],
    ["clock", `<span class="dim">${esc(JSON.stringify(svc.clock || {}))}</span>`],
  ];
  const ins = (a.sources || []).map(s =>
    `<tr><td class="key wrap">${esc(s.topic)}</td><td class="dim wrap">${esc(s.type)}</td>
     <td>${num(s.expected_hz, 1)} Hz</td>
     <td class="${s.required ? "warn" : "dim"}">${s.required ? "required" : "optional"}</td></tr>`).join("");
  const outs = ["/monitor/tick", "/monitor/observation", "/monitor/verdict",
                "/monitor/manifest", "/monitor/adapter", "/monitor/spec_status"];
  $("config").innerHTML =
    `<table>${rows.map(([k, v]) => `<tr><th>${esc(k)}</th><td class="wrap">${v}</td></tr>`).join("")}</table>
     <p class="dim" style="margin:10px 0 2px">topics in</p>
     <table class="fixed"><colgroup><col style="width:38%"><col><col style="width:16%"><col style="width:20%"></colgroup>${ins}</table>
     <p class="dim" style="margin:10px 0 2px">topics out</p>
     <div class="dim">${outs.map(t => `<span class="key">${esc(t)}</span>`).join(" · ")}</div>
     <div class="missing" style="margin-top:10px">
       real or simulated is a <b>declaration</b>, not a fact: it is the adapter name and
       doc above, chosen by whoever launched the evaluator. Replay a bag through
       <code>real_g1</code> and this page will say <code>real_g1</code>, correctly — the
       engine cannot tell, and a badge claiming otherwise would be the lie.
     </div>`;
}

/* == 3 · input data ========================================================= */

function keysOfSource(id) {
  const s = ((S.adapter || {}).sources || []).find(x => x.id === id);
  return (s && s.keys) || [];
}

function renderInputs() {
  const o = S.obs, a = S.adapter;
  if (!o || !a) return;
  const health = o.data_health || {};
  const rows = (a.sources || []).map(src => {
    const h = health[src.id] || {};
    const slow = h.expected_hz && h.rate_hz < 0.6 * h.expected_hz;
    const cls = h.refreshed === false ? "bad" : (slow ? "warn" : "ok");
    const vals = keysOfSource(src.id)
      .map(k => `<span class="key">${esc(k)}</span> ${esc(fmt(o.sensors[k]))}`)
      .join("<br>");
    return `<tr>
      <td class="wrap"><span class="${cls}">●</span> ${esc(src.id)}<br>
          <span class="dim">${esc(src.topic)}</span></td>
      <td>${num(h.rate_hz, 2)}<span class="dim">/${num(h.expected_hz, 1)} Hz</span><br>
          <span class="dim">age ${num(h.age_s, 2)} s</span></td>
      <td>${txt(h.samples_this_tick)}<br><span class="dim">drop ${txt(h.dropped)}</span></td>
      <td class="wrap">${vals || '<span class="dim">—</span>'}</td></tr>`;
  }).join("");
  $("inputs").innerHTML =
    `<table class="fixed"><colgroup><col style="width:30%"><col style="width:19%"><col style="width:13%"><col></colgroup><tr><th>source</th><th>rate</th><th>tick</th><th>values this tick</th></tr>${rows}</table>`;
  $("in-note").innerHTML = "raw payloads: " + echoNote();
}

function fmt(v) {
  if (v === undefined) return "—";
  if (typeof v === "number") return num(v);
  if (typeof v === "boolean") return v ? "true" : "false";
  return String(v);
}

/* == 3b · the echo half =====================================================

   The row table above is `data_health` off the observation: every source, every tick,
   free. This is the zoom: one source's actual frames, asked for on
   `/monitor/raw_echo_request` and arriving on `/monitor/raw_echo`. Opt-in and one at a
   time, because a point cloud per frame is not free and this console is usually across
   a link — so nothing echoes until an operator picks a source, and `source_id: null`
   is how the contract spells "stop".

   **`summary` is deliberately opaque.** `api.build_raw_echo`'s own docstring says its
   shape is the adapter's business, so that a new sensor type does not edit the wire
   contract. Which means this page renders by a `kind` discriminator it does not own.
   Three kinds have renderers here — `image`, `fields`, and `image_unavailable`, which
   is a frame the producer could not turn into a picture and says why — and a kind this
   page has never heard of is a *first-class* case and not an error: it is dumped as
   readable JSON, so the depth or lidar summary somebody writes next shows an operator
   something useful with no change here. */

/* The gateway's ingress verb, which is `INGRESS_TOPICS`'s key for
   `/monitor/raw_echo_request`. Spelled once. A build without the route answers 404 and
   the picker goes dead saying so, which is the only thing this page infers from it. */
const ECHO_VERB = "raw_echo_request";

/* How many ticks old a frame may be and still be the frame arriving now. One: the echo
   is tick-scoped, so the frame for this tick and the frame for the last one are the two
   a live echo can be showing, and anything older means nothing came. */
const ECHO_LIVE_TICKS = 1;

/* A `data_uri` is wire data and it is about to become an `img` `src` — the one place on
   this page where a string turns into something the browser fetches. So it is checked
   against an allowlist and never sanitised into one: the *whole* string must be a
   base64 data URI whose media type is one of a fixed set of raster image types.
   `javascript:…` fails it. `https://host/x.png` fails it, and must — a remote URL would
   have this page fetch from whatever host the wire named, from the origin that holds
   the X-Skill-Monitor grant. `data:text/html,…` fails it. So does `data:image/svg+xml`:
   SVG is markup that carries script, and it is left out here for the same reason `.svg`
   is not in the gateway's STATIC_TYPES. Anything that fails is *reported*, never
   loaded — the operator is told the summary claimed an image and what it actually
   carried. */
const DATA_IMAGE = /^data:image\/(?:png|jpeg|gif|webp|bmp);base64,[A-Za-z0-9+/]+={0,2}$/;

/* Past this the page refuses to load it rather than hand the browser a string measured
   in megabytes once per tick. The echo exists to make the cost of a source visible; it
   must not be the thing that makes the console unusable. */
const DATA_URI_MAX = 8 * 1024 * 1024;

function imageSrc(uri) {
  if (typeof uri !== "string") return null;
  if (uri.length > DATA_URI_MAX) return null;
  return DATA_IMAGE.test(uri) ? uri : null;
}

/* -- the picker ------------------------------------------------------------ */

function echoSources() {
  return ((S.adapter || {}).sources || []).filter(s => s && typeof s.id === "string");
}

/* Why an echo cannot be asked for, or null when one can. Same rule as the control
   strip: the one answer both disables the control and is printed beside it, so there is
   no way to have a live-looking picker that does nothing. */
function echoRefusal() {
  if (!S.seg) {
    return "no monitor is selected — the gateway has discovered no namespace to " +
      "address a request to.";
  }
  if (!S.adapter) {
    return "no /monitor/adapter is latched, so this page does not know what sources " +
      "this robot has to echo. P3 publishes it.";
  }
  if (!echoSources().length) {
    return "the adapter declares no sources, so there is nothing to echo.";
  }
  if (S.ech.route === "absent") {
    return `this gateway serves no ingress route for the request — POST ` +
      `.../${ECHO_VERB} answered ${txt(S.ech.status)} — so there is nowhere to ask ` +
      "for one. The topic and its validator are in core/api.py; the route is an " +
      "INGRESS_TOPICS entry in gateway.py, which is P6's file.";
  }
  if (S.ech.busy) return "the last request has not been answered yet.";
  return null;
}

/* Built once per source list and never rebuilt under an arriving frame: a `select`
   redrawn at the tick rate is a control that closes itself while it is being used. */
function renderEcho() {
  const sources = echoSources();
  const key = JSON.stringify(sources.map(s => [s.id, s.topic]));
  if (S.ech.key !== key) {
    S.ech.key = key;
    const options = [`<option value="">off — nothing is echoed</option>`].concat(
      sources.map(s =>
        `<option value="${esc(s.id)}">${esc(s.id)} — ${esc(s.topic)}</option>`));
    $("echo").innerHTML =
      `<div class="pick">
         <span class="dim">raw echo</span>
         <select id="echo-pick">${options.join("")}</select>
         <span id="echo-state"></span>
       </div>
       <div id="echo-note" style="margin-top:4px"></div>
       <div id="echo-why"></div>
       <div id="echo-frame"></div>`;
    $("echo-pick").onchange = () => echoAsk($("echo-pick").value || null);
  }
  updateEchoControls();
  renderEchoFrame();
}

function updateEchoControls() {
  const pick = $("echo-pick");
  if (!pick) return;
  const why = echoRefusal();
  pick.disabled = why !== null;
  // The control shows what is *echoing*, not what was last clicked. A request that was
  // refused turned nothing on, and leaving the picker on the source it named would be
  // the page claiming an echo it has no evidence for.
  pick.value = S.ech.on === null ? "" : S.ech.on;
  $("echo-why").innerHTML = why
    ? `<div class="missing">no echo: ${esc(why)}</div>` : "";
  $("echo-state").innerHTML = S.ech.on === null
    ? `<span class="dim">off — nothing is echoed, and nothing is by default</span>`
    : `<span class="ok">● echoing ${esc(S.ech.on)}</span>`;
  $("in-note").innerHTML = "raw payloads: " + echoNote();
}

/* The one-word version, in the pane's heading. */
function echoNote() {
  if (S.ech.route === "absent") return `<span class="warn">no route</span>`;
  if (S.ech.on === null) return `<span class="dim">off</span>`;
  return `<span class="ok">echoing ${esc(S.ech.on)}</span>`;
}

/* One request out, and what came back — reported with its status and its body, the way
   the command strip reports a refusal, because a control that fails quietly is a
   control an operator believes worked.

   `{schema_version, source_id}` is `api.build_raw_echo_request`'s shape exactly, and a
   null `source_id` is the contract's own stop. */
async function echoAsk(sourceId) {
  if (!S.seg || S.ech.busy) return;
  S.ech.busy = true;
  updateEchoControls();
  $("echo-note").innerHTML = `<span class="dim">asking…</span>`;
  const body = JSON.stringify({ schema_version: SCHEMA_VERSION, source_id: sourceId });
  const r = await api(`/api/monitors/${S.seg}/${ECHO_VERB}`, { method: "POST", body });
  S.ech.busy = false;
  if (r.status === 404 || r.status === 405) {
    S.ech.route = "absent";
    S.ech.status = r.status;
    // The refusal box below says the whole of it. Leaving "asking…" here would be the
    // page reporting a request that is never going to be answered.
    $("echo-note").innerHTML = "";
  } else if (r.status < 400) {
    S.ech.route = "ok";
    // Only a request that actually went out moves what this page believes is echoing.
    S.ech.on = sourceId;
    S.ech.since = latestSeq();
    S.ech.gap = false;
    // And the frame of whatever was echoing before is not a frame of this: it goes on
    // the switch and on the stop, so the last one cannot sit under a new label or under
    // an echo that has been turned off.
    S.ech.frame = null;
    $("echo-note").innerHTML = sourceId === null
      ? `<span class="dim">stop published (${txt(r.status)}) — nothing is echoed.</span>`
      : `<span class="ok">${esc(sourceId)} requested (${txt(r.status)})</span>
         <span class="dim">— published, which is not the same as arriving. What the
         evaluator does with it is what turns up on /monitor/raw_echo, and this pane
         shows nothing until something does.</span>`;
  } else {
    // The route is there and refused this request. Nothing changed at the far end, so
    // nothing changes here either, and the picker stays live for the next one.
    $("echo-note").innerHTML =
      `<span class="bad">the echo request was refused (${txt(r.status)}):
       ${esc(r.text.slice(0, 300))}</span>`;
  }
  updateEchoControls();
  renderEchoFrame();
}

function onRawEcho(payload) {
  if (!payload || typeof payload !== "object") return;
  S.ech.frame = payload;
  S.ech.gap = false;
  renderEchoFrame();
}

/* -- the frame ------------------------------------------------------------- */

function renderEchoFrame() {
  const box = $("echo-frame");
  if (!box) return;
  const f = S.ech.frame;

  if (S.ech.on === null && echoRefusal() !== null) {
    // Nothing is echoing and nothing can be asked for. The refusal above says why, and
    // "pick a source" printed under a dead picker would be an instruction that does not
    // work.
    box.innerHTML = "";
    return;
  }
  if (S.ech.on === null) {
    // Off. The one thing this must never do is leave the last frame on screen: an
    // operator who turned the echo off and still sees a picture is watching a robot
    // that stopped sending it.
    box.innerHTML = f
      ? `<div class="missing">the echo is off, and a frame for
           <code>${esc(raw(f.source_id))}</code> arrived at seq ${txt(f.seq)} anyway.
           Another console may have asked for it, or the stop has not taken effect yet.
           It is not drawn, because it is not this console's echo.</div>`
      : `<p class="dim" style="margin:7px 0 0">nothing is echoed. Pick a source above
           and this console asks for it on <code>/monitor/raw_echo_request</code>; the
           frames come back on <code>/monitor/raw_echo</code>. One source at a time,
           because a point cloud per frame is not free.</p>`;
    return;
  }

  if (!f) {
    // Requested, and nothing has come. Said as that and not as an error, and with the
    // two things it could be named rather than one of them guessed at.
    const gap = S.ech.gap
      ? `<div class="dim" style="margin-top:4px">The stream reconnected since the
           request. That gap is a period this page was not watching and the evaluator
           may have restarted inside it, so the frame it was showing was dropped and the
           request was not silently re-sent — pick the source again to ask for it.</div>`
      : "";
    box.innerHTML =
      `<div class="missing"><b>${esc(S.ech.on)}</b> was requested${echoSinceText()} and
         no <code>/monitor/raw_echo</code> frame has arrived. Nothing is drawn in the
         meantime.
         <div class="dim" style="margin-top:4px">Either the evaluator is not echoing
           this source, or the topic is not on this build's stream — it reaches a
           browser only if <code>api.RAW_ECHO</code> is in the gateway's
           <code>STREAM_TOPICS</code>. The request was published; that is all this page
           knows.</div>${gap}</div>`;
    return;
  }

  const mismatch = f.source_id === S.ech.on ? "" :
    `<div class="missing">this console asked for
       <code>${esc(S.ech.on)}</code> and these frames are
       <code>${esc(raw(f.source_id))}</code> — the echo is one source at a time for the
       whole monitor, so another console may have taken it. Shown as what it is.</div>`;
  box.innerHTML = mismatch +
    `<div id="echo-body">
       <div class="dim">source <span class="key">${esc(raw(f.source_id))}</span> ·
         seq ${txt(f.seq)} · step ${txt(f.step)} · <span id="echo-age"></span></div>
       ${echoSummary(f.summary)}
     </div>`;
  renderEchoAge();
}

/* Since when, in the unit the wire gives: ticks. Never a wall-clock duration measured
   here, for the reason `sinceText` gives — this browser's clock is not the monitor's,
   and under replay it is not even the same rate. */
function echoSinceText() {
  const now = latestSeq();
  if (typeof S.ech.since !== "number" || now === null) return "";
  const ticks = now - S.ech.since;
  return ticks >= 0 ? ` ${ticks} tick${ticks === 1 ? "" : "s"} ago` : "";
}

/* How old the frame on screen is, recomputed every tick against the tick axis. This is
   the whole of "do not show a stale frame as if it were live": the words say how many
   ticks, and the `stale` class dims and greys the picture so the answer is visible
   without reading them. Both, because either alone is a screenshot somebody
   misreads. */
function renderEchoAge() {
  const el = $("echo-age"), body = $("echo-body"), f = S.ech.frame;
  if (!el || !f) return;
  const now = latestSeq();
  if (typeof f.seq !== "number" || now === null) {
    el.innerHTML = `<span class="warn">age unknown</span>
      <span class="dim">— no seq on this page to measure the frame against</span>`;
    if (body) body.classList.add("stale");
    return;
  }
  const ticks = now - f.seq;
  if (ticks < 0) {
    el.innerHTML = `<span class="warn">ahead of this page</span>
      <span class="dim">— seq ${txt(f.seq)} against a newest ${txt(now)}; no age is
      derived from that</span>`;
    if (body) body.classList.remove("stale");
    return;
  }
  const stale = ticks > ECHO_LIVE_TICKS;
  el.innerHTML = stale
    ? `<span class="warn">${ticks} ticks old</span> <span class="dim">— nothing has
       arrived since. This is the last frame that came, not what is coming now.</span>`
    : `<span class="ok">live</span> <span class="dim">— ${ticks} tick${
        ticks === 1 ? "" : "s"} behind the newest seq</span>`;
  if (body) body.classList.toggle("stale", stale);
}

/* -- the summary, by the `kind` the adapter put on it ---------------------- */

function echoSummary(sum) {
  if (!sum || typeof sum !== "object" || Array.isArray(sum)) {
    return `<div class="missing">the frame carries no <code>summary</code> object.
      The envelope was accepted — <code>seq</code>, <code>t</code>, <code>step</code>
      and <code>source_id</code> are the wire's — but the summary is the adapter's half
      of it and there is nothing here to render.</div>`;
  }
  const kind = sum.kind;
  if (typeof kind !== "string" || !kind) {
    return `<div class="missing">the summary carries no <code>kind</code>, so this page
      cannot tell what it is a summary of. Shown as it arrived rather than guessed
      at.</div>` + echoJson(sum);
  }
  if (kind === "image") return echoImage(sum);
  if (kind === "fields") return echoFields(sum);
  if (kind === "image_unavailable") return echoImageUnavailable(sum);
  // The extension point, and it is a case rather than a fallback. A summary shape this
  // console has never seen still shows an operator every field it carries; writing a
  // renderer for it is a page change, and a new sensor type is not.
  return `<p class="dim" style="margin:7px 0 0">summary kind
    <span class="key">${esc(kind)}</span> — this console has no renderer for it, so the
    summary is shown as it arrived. That is the contract working: the shape belongs to
    the adapter, not to this page.</p>` + echoJson(sum);
}

/* The readable dump. Clipped, because `summary` is whatever the adapter put there and
   a per-tick megabyte of it in the DOM would take the console down. */
const ECHO_JSON_MAX = 20000;

function echoJson(value) {
  let text;
  try { text = JSON.stringify(value, null, 2); }
  catch (e) { text = null; }
  if (typeof text !== "string") return `<p class="warn">the summary could not be
    rendered as JSON: ${esc(String(value))}</p>`;
  const clipped = text.length > ECHO_JSON_MAX;
  return `<pre>${esc(clipped ? text.slice(0, ECHO_JSON_MAX) : text)}</pre>` + (clipped
    ? `<p class="dim">clipped at ${ECHO_JSON_MAX} characters of
       ${text.length}.</p>` : "");
}

/* What the source cost, beside whatever it produced. This is why the pane shows
   `samples_this_tick`, the echo rate and `bytes` at all: an operator who turns a camera
   on over a field link should be able to see what they turned on.

   Rows for fields the summary does not carry are left out rather than printed as a dash.
   The kinds carry different ones -- a `fields` summary has no `bytes` and nothing is
   wrong with that -- and a table of dashes reads like a producer that is failing. */
function echoFacts(sum, extra) {
  const rows = [["topic", `<span class="key wrap">${txt(sum.topic)}</span>`]]
    .concat(extra || []);
  rows.push(["samples this tick", echoSamples(sum)]);
  const rate = echoRate(sum);
  if (rate) rows.push(["echo rate", rate]);
  if (typeof sum.bytes === "number") rows.push(["bytes", echoBytes(sum)]);
  return `<table class="fixed"><colgroup><col style="width:44%"><col></colgroup>` +
    rows.map(([k, v]) => `<tr><th class="wrap">${esc(k)}</th>
      <td class="wrap">${v}</td></tr>`).join("") + `</table>`;
}

/* Samples, and -- when the echo is striding over ticks -- what that count is *of*. The
   producer accumulates the samples of the ticks it skipped into the frame it does send,
   so "14 samples this tick" on a 1-in-5 stride is fourteen messages over five ticks and
   saying "this tick" alone would be wrong. */
function echoSamples(sum) {
  const every = sum.every_n_ticks;
  return txt(sum.samples_this_tick) + ((typeof every === "number" && every > 1)
    ? ` <span class="dim">— counted over the ${every} ticks since the last frame,
        the skipped ones included</span>` : "");
}

/* The echo's own rate, which is not the tick rate: the producer limits it to a stride of
   whole ticks and reports both numbers. Shown because it is the difference between "the
   camera is on" and "the camera is on and costing this much". */
function echoRate(sum) {
  const hz = sum.rate_hz, every = sum.every_n_ticks;
  if (typeof hz !== "number" && typeof every !== "number") return "";
  const stride = (typeof every === "number" && every > 1)
    ? ` <span class="dim">— one frame every ${every} ticks</span>`
    : ` <span class="dim">— one frame a tick</span>`;
  return (typeof hz === "number" ? `${num(hz, 3)} Hz` : `<span class="dim">not
    reported</span>`) + stride;
}

/* The frame's size, and what that is per second at the echo's own rate. The rate is the
   echo's where it reports one and the adapter's tick rate otherwise, and the line says
   which -- a cost figure computed against the wrong clock is worse than none. */
function echoBytes(sum) {
  const bytes = sum.bytes;
  const echoHz = sum.rate_hz;
  const tickHz = (S.adapter || {}).tick_hz;
  const hz = typeof echoHz === "number" ? echoHz : tickHz;
  const source = typeof echoHz === "number" ? "the echo's rate"
    : "the adapter's tick rate";
  if (typeof hz !== "number" || !(hz > 0)) return `${bytes}`;
  const per = bytes * hz;
  // Bytes per second under a kilobyte: "≈ 0 kB/s" beside a 48-byte frame reads as
  // free, and the whole point of this line is that nothing an echo carries is.
  const rate = per < 1000 ? `${num(per, 0)} B/s` : `${num(per / 1000, 1)} kB/s`;
  return `${bytes} <span class="dim">≈ ${rate} at ${num(hz, 3)} Hz, ${source}</span>`;
}

/* `kind: "image"` — the frame, at its own size, and what it cost beside it. */
function echoImage(sum) {
  const shown = echoDims(sum.width, sum.height) ||
    `<span class="dim">not declared</span>`;
  const from = echoDims(sum.source_width, sum.source_height);
  const size = from
    ? `${shown} <span class="dim">from ${from} ${esc(raw(sum.source_encoding))}</span>`
    : shown;
  const facts = echoFacts(sum, [["size", size], ["encoding", txt(sum.encoding)]]);
  // Never silently smaller. The producer halves a frame that will not fit its data-URI
  // cap, and a picture quietly shrunk below the box it is drawn in is a small lie about
  // what the camera sent.
  const shrunk = sum.downscaled_to_fit === true
    ? `<p class="warn" style="margin:6px 0 0">this frame was reduced further than the
       echo's own box to fit the ${txt(sum.cap_bytes)}-byte cap on a data URI. What is
       drawn is smaller than what the camera sent, and smaller than what the echo
       normally sends.</p>` : "";
  const src = imageSrc(sum.data_uri);
  if (src === null) {
    return `<div class="missing">the summary says <code>kind: image</code> and its
        <code>data_uri</code> is not one this page will load. It has to be a
        <code>data:image/…;base64,…</code> URI under
        ${Math.round(DATA_URI_MAX / 1024)} kB, and nothing else is ever put in an
        <code>img</code> src — not a remote URL, not another scheme. Not rendered, and
        not fetched.
        <div class="dim" style="margin-top:4px">what arrived:
          ${esc(String(sum.data_uri).slice(0, 120))}</div></div>` + facts;
  }
  return `<div class="frame"><img alt="raw echo frame from ${esc(raw(sum.topic))}"
      src="${esc(src)}">${facts}</div>` + shrunk;
}

/* `kind: "image_unavailable"` — the producer had a frame and could not turn it into a
   picture. Its `reason` is a sentence written for an operator, and it is rendered as
   one: "encoding '16UC1' is not one this echo can render" is an answer somebody can act
   on, and the same fact as a JSON blob is not. A depth topic is the first thing anybody
   clicks, so this is a normal outcome and is not drawn as a fault. */
function echoImageUnavailable(sum) {
  const from = echoDims(sum.source_width, sum.source_height);
  const facts = echoFacts(sum, [
    ["source", from
      ? `${from} <span class="dim">${esc(raw(sum.source_encoding))}</span>`
      : `<span class="dim">${esc(raw(sum.source_encoding))}</span>`],
    ["source bytes", txt(sum.source_bytes)],
  ]);
  const why = typeof sum.reason === "string" && sum.reason
    ? esc(sum.reason)
    : `<span class="dim">the summary gives no <code>reason</code>, so this page has
       none to show.</span>`;
  return `<div class="missing" style="border-left-color:var(--acc)">
      <b>no picture from this source.</b> ${why}
      <div class="dim" style="margin-top:4px">The source is being echoed and its frames
        are arriving; what cannot be done is turning one into an image. Nothing is drawn
        rather than something misleading — a frame decoded with the wrong stride or the
        wrong encoding renders as a plausible picture of nothing.</div>
    </div>` + facts;
}

function echoDims(width, height) {
  return (typeof width === "number" && typeof height === "number")
    ? `${num(width, 0)} × ${num(height, 0)}` : "";
}

/* `kind: "fields"` — a value table. Sorted, so the same source reads the same way twice
   running and a row does not move under the cursor when a key order changes. */
function echoFields(sum) {
  const facts = echoFacts(sum);
  const values = sum.values;
  if (!values || typeof values !== "object" || Array.isArray(values)) {
    return facts + `<div class="missing">the summary says <code>kind: fields</code> and
      carries no <code>values</code> object.</div>` + echoJson(sum);
  }
  const keys = Object.keys(values).sort();
  if (!keys.length) {
    return facts + `<p class="dim">the summary's <code>values</code> is empty — the
      source produced no field this tick.</p>`;
  }
  return facts +
    `<table class="fixed"><colgroup><col style="width:44%"><col></colgroup>
     <tr><th>field</th><th>value</th></tr>` +
    keys.map(k => `<tr><td class="key wrap">${esc(k)}</td>
      <td class="wrap">${esc(echoValue(values[k]))}</td></tr>`).join("") + `</table>`;
}

/* A field's value may be a nested object — `fmt` would render that "[object Object]",
   which tells an operator nothing. */
function echoValue(v) {
  if (v !== null && typeof v === "object") {
    try { return JSON.stringify(v); } catch (e) { return String(v); }
  }
  return fmt(v);
}

/* == 4 · plots ============================================================== */

function renderPlots() {
  const a = S.adapter; if (!a) return;
  const numeric = Object.keys(a.schema || {}).filter(k =>
    S.hist.some(o => typeof o.sensors[k] === "number"));
  if (!$("plots").childElementCount) {
    $("plots").innerHTML = numeric.map(k =>
      `<div class="plot"><div class="lbl"><span class="key">${esc(k)}</span>
        <span id="pv-${esc(k)}"></span></div><canvas id="pc-${esc(k)}"></canvas></div>`).join("");
  }
  for (const k of numeric) {
    const series = S.hist.map(o => o.sensors[k]).filter(v => typeof v === "number");
    const el = $("pv-" + k); if (el) el.textContent = num(series[series.length - 1]);
    drawSpark($("pc-" + k), series);
  }
}

function drawSpark(canvas, series) {
  if (!canvas || series.length < 2) return;
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w * dpr) { canvas.width = w * dpr; canvas.height = h * dpr; }
  const g = canvas.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  let lo = Math.min(...series), hi = Math.max(...series);
  if (hi - lo < 1e-9) { hi = lo + 1; lo -= 1; }   // a flat line belongs in the middle
  g.beginPath();
  series.forEach((v, i) => {
    const x = (i / (PLOT_N - 1)) * w;
    const y = h - 2 - ((v - lo) / (hi - lo)) * (h - 4);
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  });
  g.strokeStyle = "#6aa9ff"; g.lineWidth = 1; g.stroke();
}

/* == 5 · atomic propositions ================================================ */

/* The executable half of "True when <expr>. <prose>". The terminator is a
   sentence-ending period -- one followed by whitespace or the end -- and never any
   period, because matching any period cuts `min_range < 0.25` down to `min_range < 0`,
   which is never true for a distance. Same rule as core/spec_contract.py. */
function ruleOf(description) {
  const m = /[Tt]rue when\s+([\s\S]+?)(?:\.\s|\.$|$)/.exec(String(description));
  return m ? m[1].trim().replace(/\.$/, "") : "";
}

/* Which schema keys a rule reads. The same question `spec_contract.sensor_keys_in_rule`
   answers server-side; here it is a word-boundary match against the keys the adapter
   declares, which is exact for the identifiers that matter and cannot invent a key the
   robot does not have. String literals are stripped first so a nav_state value spelled
   like a key is not counted as one.

   The key is regex-escaped first. It is wire data -- whatever the adapter declares --
   and one metacharacter in it (`a(b`) makes `new RegExp` throw `Unterminated group`,
   which is not a bad row in the AP pane, it is no AP pane at all. */
const reEsc = s => String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

function keysInRule(description) {
  const body = ruleOf(description).replace(/'[^']*'|"[^"]*"/g, " ");
  return Object.keys((S.adapter || {}).schema || {})
    .filter(k => new RegExp(`\\b${reEsc(k)}\\b`).test(body));
}

function renderAps() {
  const m = S.manifest, o = S.obs;
  if (!m || !o) return;
  const aps = m.atomic_propositions || {};
  const unknown = new Set(o.unknown_aps || []);
  const rows = Object.keys(aps).sort().map(name => {
    const rule = aps[name];
    const keys = keysInRule(rule);
    const value = unknown.has(name)
      ? `<span class="unk">UNKNOWN</span>`
      : (o.ap_values[name] ? `<span class="ok">true</span>` : `<span class="dim">false</span>`);
    const live = keys.map(k =>
      `<span class="key">${esc(k)}</span>=${esc(fmt(o.sensors[k]))}`).join(" ");
    return `<tr><td class="wrap">${esc(name)}</td><td>${value}</td>
      <td class="wrap"><span class="rule">${esc(rule)}</span><br>${live ||
        '<span class="dim">reads no declared key</span>'}</td></tr>`;
  }).join("");
  $("aps").innerHTML =
    `<table class="fixed"><colgroup><col style="width:26%"><col style="width:16%"><col></colgroup><tr><th>ap</th><th>this tick</th><th class="wrap">rule → keys it reads → live values</th></tr>${rows}</table>
     <p class="dim" style="margin:8px 0 0">confidence ${num(o.confidence, 2)} ·
       ${unknown.size} unknown · clock <span class="key">${esc(o.clock)}</span> ·
       membership by ${esc(o.tick_membership)}</p>`;
}

/* == 6 · automaton ==========================================================

   `manifest.automata` is the structure and it is latched: it changes only when a spec
   is pushed. `formulas[].state` / `failure_modes[].state` is the position and it
   changes every verdict. So the SVG is laid out once per manifest and every verdict
   after that toggles two classes per node -- rebuilding three graphs at the tick rate
   would fight the same pulse that drives panes 3 to 5, and would throw away the one
   thing this pane accumulates.

   A graph is matched to a row by `name`, and by nothing else. No row, or a row whose
   `state` is null, means nothing is lit: the initial state is where the automaton
   *starts*, not where it is, and lighting it on a null would be the page inventing the
   one field it was told the producer could not supply. */

const AUT = { R: 15, COL: 136, ROW: 66, PAD: 34, TOP: 70 };

function renderAutomaton() {
  const v = S.verdict || null;
  const graphs = (S.manifest || {}).automata;
  const box = $("automaton");
  if (!Array.isArray(graphs)) {
    // Absent, which is how a build that cannot report automata at all says so. Not the
    // same as the empty list below, which is a build that can and has none to give.
    S.aut.key = null;
    box.innerHTML =
      missing("manifest.automata / formulas[].state", "P4",
        "the monitor publishes each formula's status but not the automaton it " +
        "stepped, so there is no graph to draw and no current state to light.") +
      `<div id="aut-rows">${formulaTable(v)}</div>`;
    return;
  }
  if (!graphs.length) {
    S.aut.key = null;
    box.innerHTML =
      `<div class="missing">the manifest reports <code>automata</code> and declares
        none: no formula in this spec compiled to a graph. The statuses below are the
        whole of what the monitor has to say about it.</div>
       <div id="aut-rows">${formulaTable(v)}</div>`;
    return;
  }
  const key = JSON.stringify(graphs);
  if (key !== S.aut.key) {
    S.aut = { key: key, trace: graphs.map(() => []), from: null, last: null };
    box.innerHTML = graphs.map(drawGraph).join("") +
      `<p class="dim" id="aut-witness" style="margin:2px 0 0"></p>
       <p class="dim" style="margin:4px 0 0">◯ ordinary · ◎ accepting · ▢ absorbing
         sink · ▣ accepting and absorbing. The filled node is the state the last verdict
         reported; shaded nodes are the ones this page has seen it in.</p>
       <div id="aut-rows"></div>`;
  }
  lightAutomata(graphs, v);
  $("aut-rows").innerHTML = formulaTable(v);
}

/* The only thing that runs per verdict: a class swap per node, and two captions written
   as text. Nothing here touches the geometry. */
function lightAutomata(graphs, v) {
  const rows = ((v || {}).formulas || []).concat((v || {}).failure_modes || []);
  const step = typeof (v || {}).step === "number" ? v.step : null;
  // A step that went backwards is a new episode, and one episode's states are not the
  // next one's path. Measured against the *last* step seen and not against `from`: a
  // page that connected at step 1 would otherwise never see a restart at all, and the
  // trace would run `... → 4 → 1 → 2 ...` straight through the end of the run.
  if (step !== null && S.aut.last !== null && step < S.aut.last) {
    S.aut.trace = graphs.map(() => []); S.aut.from = null;
  }
  if (step !== null) S.aut.last = step;
  graphs.forEach((g, gi) => {
    const row = rows.find(r => r && r.name === g.name);
    // `typeof === "number"` and not a truthiness test: state 0 is a state, and both a
    // null and an absent field mean the producer could not report one.
    const at = row && typeof row.state === "number" ? row.state : null;
    const trace = S.aut.trace[gi] || (S.aut.trace[gi] = []);
    if (at !== null) {
      if (trace[trace.length - 1] !== at) trace.push(at);
      if (trace.length > 40) trace.shift();
      if (S.aut.from === null) S.aut.from = step;
    }
    (g.states || []).forEach((s, si) => {
      const el = $(`aut${gi}n${si}`); if (!el) return;
      el.classList.toggle("cur", at !== null && Number(s.id) === at);
      el.classList.toggle("seen", trace.indexOf(Number(s.id)) >= 0);
    });
    const cap = $(`aut${gi}c`);
    if (!cap) return;
    // Three different silences, and the pane says which one it is. The graphs are
    // latched and arrive before the first verdict does, so "nothing lit yet" is a
    // state this pane really passes through and not a hypothetical.
    cap.textContent = at !== null
      ? `state ${at} · seen ${trace.join(" → ")}`
      : !v ? "no verdict seen yet — nothing is lit"
      : row ? "the last verdict reported no state for this monitor — nothing is lit"
            : "no verdict row carries this monitor's name — nothing is lit";
  });
  const w = $("aut-witness");
  if (w) {
    w.textContent = S.aut.from === null
      ? "nothing lit: no state witnessed on this connection yet."
      : `The shaded path is only what this page witnessed. It begins at step ` +
        `${S.aut.from}, where this page connected — not at the start of the episode, ` +
        `which happened before there was anyone here to see it.`;
  }
}

/* Layered left to right: BFS depth from the initial state is the column, arrival order
   within a depth is the row. Deterministic, a few dozen lines, and enough for the
   single-digit state counts these automata have -- a layout library would be a build
   step, and this page has none. */
function drawGraph(g, gi) {
  const states = Array.isArray(g.states) ? g.states : [];
  const edges = Array.isArray(g.edges) ? g.edges : [];
  const at = {};
  states.forEach((s, i) => { at[String(s.id)] = i; });

  const col = states.map(() => null), queue = [];
  const start = at[String(g.initial)];
  if (start !== undefined) { col[start] = 0; queue.push(start); }
  for (let k = 0; k < queue.length; k++) {
    for (const e of edges) {
      if (at[String(e.from)] !== queue[k]) continue;
      const to = at[String(e.to)];
      if (to === undefined || col[to] !== null) continue;
      col[to] = col[queue[k]] + 1; queue.push(to);
    }
  }
  // A state the initial one cannot reach is drawn in a column past the rest, not
  // dropped: a graph the page cannot lay out is still a graph it must not hide.
  let deepest = 0;
  col.forEach(c => { if (c !== null && c > deepest) deepest = c; });
  col.forEach((c, i) => { if (c === null) col[i] = deepest + 1; });

  const filled = {};
  const row = col.map(c => { const r = filled[c] || 0; filled[c] = r + 1; return r; });
  let maxCol = 0, maxRow = 0;
  col.forEach((c, i) => {
    if (c > maxCol) maxCol = c;
    if (row[i] > maxRow) maxRow = row[i];
  });
  const X = i => AUT.PAD + col[i] * AUT.COL, Y = i => AUT.TOP + row[i] * AUT.ROW;
  // Drawn at its own size and allowed to shrink, never to stretch: a full-width
  // two-state safety automaton would be the size of a four-state chain, and size on a
