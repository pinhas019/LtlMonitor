version: '3.8'

services:
  mujoco-sim:
    container_name: ltl-mujoco-sim
    build:
      context: .
      dockerfile: Dockerfile.sim
    network_mode: host
    ipc: host
    environment:
      - ROS_DOMAIN_ID=0
      - PYTHONUNBUFFERED=1
    volumes:
      - ./sim_config.json:/app/sim_config.json
      - ./mujoco_ros_bridge.py:/app/mujoco_ros_bridge.py
      - ./arena.xml:/app/arena.xml

  nav2:
    container_name: ltl-nav2
    build:
      context: .
      dockerfile: Dockerfile.nav2
    network_mode: host
    ipc: host
    environment:
      - ROS_DOMAIN_ID=0
      - PYTHONUNBUFFERED=1
    depends_on:
      - mujoco-sim
    volumes:
      - ./sim_config.json:/app/sim_config.json
      - ./send_goal.py:/app/send_goal.py
      - ./generate_map.py:/app/generate_map.py
      - ./arena.xml:/app/arena.xml
      - ./nav2_params.yaml:/app/nav2_params.yaml

  ltl-monitor:
    container_name: ltl-monitor
    build:
      context: ..
      dockerfile: Dockerfile
    network_mode: host
    ipc: host
    environment:
      - ROS_DOMAIN_ID=0
      - PYTHONUNBUFFERED=1
    volumes:
      - ../formulas.json:/app/formulas.json
      - ../output:/app/output
    command: ["--formulas-file", "formulas.json"]

  llm-client:
    container_name: ltl-llm-client
    build:
      context: ..
      dockerfile: Dockerfile.llm
    network_mode: host
    ipc: host
    environment:
      - ROS_DOMAIN_ID=0
      - PYTHONUNBUFFERED=1
    command: ["--model", "${LLM_MODEL:-Gemma4}", "--api-url", "${LLM_API_URL:-http://192.168.140.111/developer-api/v1}"]
    depends_on:
      - ltl-monitor

  foxglove-bridge:
    container_name: ltl-foxglove-bridge
    build:
      context: .
      dockerfile: Dockerfile.foxglove
    network_mode: host
    ipc: host
    environment:
      - ROS_DOMAIN_ID=0

  dozzle:
    container_name: ltl-dozzle
    image: amir20/dozzle:latest
    network_mode: host
    environment:
      - DOZZLE_BASE=/dozzle
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
