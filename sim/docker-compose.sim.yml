version: '3.8'

# Sim verification for the G1 navigation skill (formulas_g1.json) against the MuJoCo+
# Nav2 harness, using the SAME generic_client.py + formulas_g1.json that run against
# the real robot -- only ltl-client's --adapter flag changes. No topic-translation
# shim containers: adapter_mujoco.py maps MuJoCo/Nav2's native topics straight to the
# canonical sensor_eval schema in-process.
#
#   docker compose -f docker-compose.sim.yml up --build
#
# VisualGoalConfirmation needs a manually-published /vision/goal_similarity (Float32)
# -- MuJoCo has no camera. Publish it via `docker exec -d ltl-nav2 bash -c "source
# /opt/ros/humble/setup.bash && ros2 topic pub -r 2 /vision/goal_similarity
# std_msgs/msg/Float32 'data: 0.9'"` BEFORE the mission finishes (that phase only
# holds for 10 steps/~10s) -- publish from inside an already-running compose service,
# not a standalone `docker run`, which was observed to not reliably reach this
# stack's DDS graph in dev-sandbox testing despite matching QoS and discovery.
services:
  mujoco-sim:
    container_name: ltl-mujoco-sim
    build:
      context: .
      dockerfile: Dockerfile.sim
    network_mode: host
    ipc: host
    environment:
      - ROS_DOMAIN_ID=0
      - PYTHONUNBUFFERED=1
    volumes:
      # Whole package, live-editable: one mount instead of a per-file list
      # that silently went stale whenever a module was added.
      - ./sim_config.json:/app/sim_config.json
      - ./mujoco_ros_bridge.py:/app/mujoco_ros_bridge.py
      - ./arena.xml:/app/arena.xml

  nav2:
    container_name: ltl-nav2
    build:
      context: .
      dockerfile: Dockerfile.nav2
    network_mode: host
    ipc: host
    environment:
      - ROS_DOMAIN_ID=0
      - PYTHONUNBUFFERED=1
    depends_on:
      - mujoco-sim
    volumes:
      # Whole package, live-editable: one mount instead of a per-file list
      # that silently went stale whenever a module was added.
      - ./sim_config.json:/app/sim_config.json
      - ./send_goal.py:/app/send_goal.py
      - ./generate_map.py:/app/generate_map.py
      - ./arena.xml:/app/arena.xml
      - ./nav2_params.yaml:/app/nav2_params.yaml

  ltl-monitor:
    container_name: ltl-monitor
    build:
      context: ..
      dockerfile: Dockerfile
    network_mode: host
    ipc: host
    environment:
      - ROS_DOMAIN_ID=0
      - PYTHONUNBUFFERED=1
    volumes:
      # Whole package, live-editable: one mount instead of a per-file list
      # that silently went stale whenever a module was added.
      - ../skill_monitor:/app/skill_monitor
      # Both mounted: default command runs the generic formulas.json (what
      # run_pipeline.py generates/validates for an arbitrary skill description --
      # unrelated to G1). To exercise the G1 nav skill specifically, override at
      # `docker compose run`: `docker compose run ltl-monitor --formulas-file formulas_g1.json`.
      - ../output:/app/output
    command: ["--formulas-file", "skill_monitor/specs/formulas.json"]

  # Agnostic to environment (this file drives it against MuJoCo+Nav2 via --adapter
  # mujoco) and to skill type (formulas_g1.json above is just the currently-active
  # spec; see main.py's --skills-dir for swapping skills without touching this stack).
  # --adapter real_g1 / isaac_lab select the other environments generic_client.py
  # supports -- same image, same formulas_g1.json, no shim containers needed.
  ltl-client:
    container_name: ltl-client
    build:
      context: ..
      dockerfile: Dockerfile.client
    network_mode: host
    ipc: host
    environment:
      - ROS_DOMAIN_ID=0
      - PYTHONUNBUFFERED=1
    command: ["--adapter", "mujoco", "--model", "${LLM_MODEL:-Gemma4}", "--api-url", "${LLM_API_URL:-http://192.168.140.101/developer-api/v1}"]
    volumes:
      # Whole package, live-editable: one mount instead of a per-file list
      # that silently went stale whenever a module was added.
      - ../skill_monitor:/app/skill_monitor
    depends_on:
      - ltl-monitor
      - nav2

  foxglove-bridge:
    container_name: ltl-foxglove-bridge
    build:
      context: .
      dockerfile: Dockerfile.foxglove
    network_mode: host
    ipc: host
    environment:
      - ROS_DOMAIN_ID=0

  dozzle:
    container_name: ltl-dozzle
    image: amir20/dozzle:latest
    network_mode: host
    environment:
      - DOZZLE_BASE=/dozzle
    volumes:
      # Whole package, live-editable: one mount instead of a per-file list
      # that silently went stale whenever a module was added.
      - /var/run/docker.sock:/var/run/docker.sock
